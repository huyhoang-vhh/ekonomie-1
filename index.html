<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>EKONOMIE I</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: skleněná horní lišta, celoplošné pásy (bílý / šedý / černý) střídané jako na apple.com, obsah 980px, velké tituly, zaoblené dlaždice */
:root {
  --bg: #ffffff;
  --bg-alt: #f4f5f9;
  --tile: #ffffff;
  --ink: #1d1d1f;
  --ink-2: #6e6e73;
  --line: #dcdde4;
  --blue: #0071e3;
  --link: #0066cc;
  --new: #b64400;                /* oranžové „Nové“ */
  --hero-ink: #1d1d1f;
  --hero-ink-2: #5f5f68;
  --mark: #fff3c4;
  --mark-ink: #4a3b00;
  --ok: #1d8a3a;
  --bad: #d70015;
  --hard: #8944ab;               /* fialová „extra těžké“ */
  --nav: rgba(255, 255, 255, .97);
  --g1: #0a6cff; --g2: #7b3fe4; --g3: #e5532b;
  --grad: linear-gradient(90deg, var(--g1) 0%, var(--g2) 50%, var(--g3) 100%);
  /* úvodní pás a zvýrazněná dlaždice: ve světlém motivu světlé, ve tmavém černé */
  --hero-bg: linear-gradient(180deg, #eef2ff 0%, #f6f3ff 60%, #ffffff 100%);
  --hero-tile: #ffffff; --hero-line: #d9dcea; --hero-scheme: light;
  --feat-bg: linear-gradient(140deg, #edf2ff 0%, #f3eeff 55%, #fff3ee 100%);
  --feat-ink: #1d1d1f; --feat-edge: inset 0 0 0 1px rgba(91, 84, 220, .12), 0 1px 2px rgba(22, 27, 45, .04), 0 12px 32px -20px rgba(60, 50, 160, .28);
  --aur1: rgba(10, 108, 255, .17); --aur2: rgba(123, 63, 228, .14); --aur3: rgba(229, 83, 43, .09);
  --sel-bg: #e8f1ff; --sel-ink: #0058c4; --sel-ring: inset 0 0 0 1px rgba(0, 113, 227, .35);
  --card-edge: inset 0 0 0 1px #d6d8e1;
  --tile-on-bg: #f4f5f9;           /* karty v bílém pásu dostanou jemně šedou výplň */
  --card-sh: 0 1px 2px rgba(22, 27, 45, .04), 0 12px 32px -20px rgba(22, 27, 45, .22);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --r-tile: 28px;
  --r-card: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --bg-alt: #101010; --tile: #1d1d1f; --ink: #f5f5f7; --ink-2: #a1a1a6; --line: #424245;
    --blue: #0a84ff; --link: #2997ff; --new: #ff8a3d; --hero: #000000; --hero-ink: #f5f5f7; --hero-ink-2: #a1a1a6;
    --mark: #3d3410; --mark-ink: #ffe38a; --ok: #32d74b; --bad: #ff453a; --hard: #c77dff; --nav: rgba(22, 22, 23, .97);
    --g1: #2997ff; --g2: #a35cff; --g3: #ff6a3d;
    --hero-bg: #000000; --hero-tile: #1d1d1f; --hero-line: #424245; --hero-scheme: dark;
    --feat-bg: #000000; --feat-ink: #f5f5f7; --feat-edge: none;
    --aur1: rgba(41, 151, 255, .30); --aur2: rgba(163, 92, 255, .24); --aur3: rgba(255, 106, 61, .14); --card-sh: 0 0 #0000; --card-edge: 0 0 #0000; --tile-on-bg: #1d1d1f; --sel-bg: #f5f5f7; --sel-ink: #000000; --sel-ring: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --bg-alt: #101010; --tile: #1d1d1f; --ink: #f5f5f7; --ink-2: #a1a1a6; --line: #424245;
  --blue: #0a84ff; --link: #2997ff; --new: #ff8a3d; --hero: #000000; --hero-ink: #f5f5f7; --hero-ink-2: #a1a1a6;
  --mark: #3d3410; --mark-ink: #ffe38a; --ok: #32d74b; --bad: #ff453a; --hard: #c77dff; --nav: rgba(22, 22, 23, .97);
  --g1: #2997ff; --g2: #a35cff; --g3: #ff6a3d;
  --hero-bg: #000000; --hero-tile: #1d1d1f; --hero-line: #424245; --hero-scheme: dark;
  --feat-bg: #000000; --feat-ink: #f5f5f7; --feat-edge: none;
  --aur1: rgba(41, 151, 255, .30); --aur2: rgba(163, 92, 255, .24); --aur3: rgba(255, 106, 61, .14); --card-sh: 0 0 #0000; --card-edge: 0 0 #0000; --tile-on-bg: #1d1d1f; --sel-bg: #f5f5f7; --sel-ink: #000000; --sel-ring: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.47; letter-spacing: -.022em; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--nav); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
p { margin: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }

/* --- horní lišta --- */
.gnav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--nav); border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.gnav-in { max-width: 1024px; margin: 0 auto; height: 48px; display: flex; align-items: center; gap: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { all: unset; cursor: pointer; font-weight: 600; font-size: 19px; letter-spacing: -.02em; margin-right: 12px; white-space: nowrap; }
.links button:focus-visible, .brand:focus-visible { outline: 2px solid var(--blue); }
.theme { all: unset; cursor: pointer; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 99px; color: var(--ink); opacity: .8; }
.theme:hover { opacity: 1; background: color-mix(in srgb, var(--ink) 8%, transparent); }
.theme svg { width: 17px; height: 17px; }

/* --- pásy --- */
.band { padding-block: 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.band.alt { background: var(--bg-alt); }
.band.dark { background: var(--hero-bg); color: var(--hero-ink); --ink: var(--hero-ink); --ink-2: var(--hero-ink-2); --tile: var(--hero-tile); --line: var(--hero-line); color-scheme: var(--hero-scheme); }
.band.tight { padding-block: 40px; }
.inner { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.inner.narrow { max-width: 760px; }
.center { text-align: center; align-items: center; }
.eyebrow { font-size: 17px; font-weight: 600; color: var(--new); letter-spacing: -.01em; }
.display { font-size: clamp(44px, 8vw, 88px); line-height: 1.04; letter-spacing: -.035em; font-weight: 700; }
.grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.h1 { font-size: clamp(36px, 5.5vw, 56px); line-height: 1.07; letter-spacing: -.03em; }
.h2 { font-size: clamp(28px, 4vw, 40px); line-height: 1.1; letter-spacing: -.025em; }
.h3 { font-size: 21px; line-height: 1.2; letter-spacing: -.015em; }
.sub { font-size: clamp(19px, 2.2vw, 24px); line-height: 1.3; color: var(--ink-2); letter-spacing: -.015em; font-weight: 400; max-width: 46ch; }
.center .sub { margin-inline: auto; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; letter-spacing: -.01em; }

/* --- tlačítka --- */
.ctas { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; }
.center .ctas { justify-content: center; }
.pill { all: unset; box-sizing: border-box; cursor: pointer; background: var(--blue); color: #fff; font-size: 17px; padding: 11px 22px; border-radius: 980px; text-align: center; }
.pill:hover { filter: brightness(1.08); }
.pill.ghost { background: transparent; color: var(--link); box-shadow: inset 0 0 0 1px var(--link); }
.pill.sm { font-size: 14px; padding: 7px 15px; }
.pill:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.more { all: unset; cursor: pointer; color: var(--link); font-size: 17px; }
.more::after { content: " ›"; }
.more:hover { text-decoration: underline; }
.more:focus-visible { outline: 2px solid var(--blue); }

/* --- dlaždice --- */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.tile { all: unset; box-sizing: border-box; cursor: pointer; background: var(--tile); border-radius: var(--r-tile); padding: 40px 36px; display: flex; flex-direction: column; gap: 8px; min-height: 300px; position: relative; overflow: hidden; }
.tile:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.tile.dark { background: var(--feat-bg); color: var(--feat-ink); box-shadow: var(--feat-edge); }
.tile { box-shadow: var(--card-edge), var(--card-sh); }
.tile .big { font-size: clamp(48px, 7vw, 72px); font-weight: 700; letter-spacing: -.04em; line-height: 1; margin-top: auto; font-variant-numeric: tabular-nums; }
.tile .h2 { font-size: clamp(26px, 3vw, 34px); }
.tile p { color: var(--ink-2); font-size: 17px; }
.tile.dark p { color: var(--ink-2); }
.tile .more { margin-top: 4px; }
.tile.wide { grid-column: 1 / -1; min-height: 0; }
.meter { height: 6px; border-radius: 99px; background: color-mix(in srgb, var(--ink-2) 25%, transparent); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--grad); }

/* --- statistiky --- */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-size: clamp(36px, 5vw, 48px); font-weight: 700; letter-spacing: -.035em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.stat span { color: var(--ink-2); font-size: 15px; }

/* --- kroky (sekvence) --- */
.steps3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; counter-reset: s; }
.step3 { background: var(--tile); border-radius: var(--r-card); padding: 28px; display: flex; flex-direction: column; gap: 8px; }
.step3 .n { font-size: 15px; font-weight: 600; color: var(--ink-2); }

/* --- čipy, filtry --- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.center .chips { justify-content: center; }
.chip { all: unset; cursor: pointer; font-size: 14px; padding: 7px 14px; border-radius: 99px; background: var(--tile); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }
.chip:hover { box-shadow: inset 0 0 0 1px var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-ink); box-shadow: var(--sel-ring); font-weight: 500; }
.chip:focus-visible { outline: 2px solid var(--blue); }
.search { width: 100%; max-width: 420px; font: inherit; font-size: 17px; padding: 11px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--tile); color: var(--ink); }
.toggle { display: inline-flex; gap: 10px; align-items: center; font-size: 15px; cursor: pointer; }
.toggle input { appearance: none; width: 42px; height: 26px; border-radius: 99px; background: var(--line); position: relative; cursor: pointer; transition: background .2s; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.toggle input:checked { background: var(--ok); }
.toggle input:checked::after { transform: translateX(16px); }
@media (prefers-reduced-motion: reduce) { .toggle input, .toggle input::after { transition: none; } }

/* --- karty příkladů a důkazů --- */
.card { background: var(--tile); border-radius: var(--r-card); padding: 24px 26px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.tag { font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--ink-2); }
.tag.hot { color: var(--new); }
.pid { font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
.pts { margin-left: auto; font-size: 14px; color: var(--ink-2); }
.task { min-width: 0; }
.task p { margin: 4px 0; }
details { border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; color: var(--link); font-size: 15px; list-style: none; display: inline-block; }
summary::-webkit-details-marker { display: none; }
summary::after { content: " ›"; display: inline-block; transition: transform .2s; }
details[open] > summary::after { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { summary::after { transition: none; } }
details > div { padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
details > div.ans { align-items: flex-start; }
.ans mjx-container { background: var(--mark); color: var(--mark-ink); padding: 4px 12px; border-radius: 8px; }
mjx-container[display="true"] { max-width: 100%; padding: 2px 0; margin: 6px 0 !important; }
.list { display: flex; flex-direction: column; gap: 16px; }

/* důkazy */
.proof .stmt { font-size: 17px; }
.proof .idea { background: color-mix(in srgb, var(--blue) 8%, transparent); border-radius: 12px; padding: 12px 16px; font-size: 16px; }
.proof ol { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 10px; }
.proof ol li { padding-left: 4px; }
.proof ol li::marker { color: var(--ink-2); font-weight: 600; }
.proof .pit { border-left: 3px solid var(--new); padding: 4px 0 4px 14px; font-size: 16px; }
.proof .pit b:first-child { color: var(--new); }
.known { all: unset; cursor: pointer; margin-left: auto; font-size: 13px; padding: 5px 12px; border-radius: 99px; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); white-space: nowrap; }
.known[aria-pressed="true"] { background: var(--ok); color: #fff; box-shadow: none; }
.known:focus-visible { outline: 2px solid var(--blue); }
.actions { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
.nop { font-size: 14px; color: var(--ink-2); }

/* písemky */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tcard { all: unset; box-sizing: border-box; cursor: pointer; background: var(--tile); border-radius: var(--r-card); padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 2px; min-height: 112px; }
.tcard b { font-size: 28px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.tcard span { font-size: 13px; color: var(--ink-2); }
.tcard .st { margin-top: auto; font-size: 13px; color: var(--link); }
.tcard.done .st { color: var(--ok); font-weight: 600; }
.tcard.locked { cursor: default; opacity: .5; }
.tcard:focus-visible { outline: 2px solid var(--blue); }
.testbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 48px); z-index: 10; background: var(--nav); border-bottom: 1px solid var(--line); padding: 10px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.testbar .in { max-width: 980px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.timer { font-size: 28px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; min-width: 4.2em; }
.timer.low { color: var(--bad); }
.score { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; background: var(--tile); border-radius: var(--r-card); padding: 18px 22px; }
.score input[type=number] { width: 4.6em; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }

/* teorie */
.topic { display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 72px; }
.thm { background: var(--tile); border-radius: var(--r-card); padding: 20px 24px; display: flex; flex-direction: column; gap: 6px; }
.thm .lbl { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-2); }
.steps { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.lead { color: var(--ink-2); font-size: 19px; }
.note { background: var(--tile); border-radius: var(--r-card); padding: 18px 22px; display: flex; flex-direction: column; gap: 8px; }
.note.warn { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--new) 50%, transparent); }
.soon { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--new); vertical-align: middle; margin-left: 8px; }
ul.plain { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.check { display: flex; gap: 10px; align-items: baseline; cursor: pointer; }

/* tabulky */
.tbl { overflow-x: auto; background: var(--tile); border-radius: var(--r-card); }
table { border-collapse: collapse; width: 100%; font-size: 16px; }
td, th { text-align: left; padding: 14px 18px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-2); font-weight: 600; }
.past { color: var(--ink-2); }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; margin-top: 4px; }
.badge.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.badge.soon { color: var(--new); background: color-mix(in srgb, var(--new) 12%, transparent); }

footer.foot { font-size: 12px; color: var(--ink-2); line-height: 1.5; border-top: 1px solid var(--line); padding-top: 16px; }

@media (max-width: 734px) {
  body { font-size: 16px; }
  .band { padding-block: 52px; }
  .tiles, .steps3, .stats { grid-template-columns: minmax(0, 1fr); }
  .tile { min-height: 220px; padding: 30px 26px; }
  .card { padding: 20px 18px; }
  .brand { font-size: 17px; margin-right: 4px; }
}

/* sbírka po tématech, souhrny a grafy */
.tgroup { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.row-h { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.ans .txt { background: var(--mark); color: var(--mark-ink); padding: 6px 12px; border-radius: 8px; }
.ans .txt:has(.sum) { background: none; color: inherit; padding: 0; display: flex; flex-direction: column; gap: 14px; width: 100%; }
dl.sum { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; font-size: 15px; }
dl.sum dt { color: var(--ink-2); font-weight: 600; }
dl.sum dd { margin: 0; }
.plot { width: 100%; max-width: 480px; height: auto; background: var(--bg-alt); border-radius: 14px; }
.plot .ax { stroke: var(--ink-2); stroke-width: 1; opacity: .5; }
.plot .as { stroke: var(--new); stroke-width: 1.2; stroke-dasharray: 5 5; }
.plot .cv { fill: none; stroke: var(--blue); stroke-width: 2.4; stroke-linejoin: round; }
.plot .pt { fill: var(--ink); }
.plot .ip { fill: var(--bg-alt); stroke: var(--ink); stroke-width: 2; }

/* obrázky k důkazům */
figure.pfig { margin: 0; background: var(--bg-alt); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
figure.pfig figcaption { font-size: 14px; color: var(--ink-2); line-height: 1.4; }
.fg { width: 100%; height: auto; max-width: 520px; display: block; }
.fpair { display: flex; flex-wrap: wrap; gap: 8px; }
.fpair .fg { flex: 1 1 140px; max-width: 280px; }
.fg text { font: 12px var(--font); fill: var(--ink-2); letter-spacing: 0; }
.fg text.strong { fill: var(--ink); font-weight: 600; }
.fg text.ok { fill: var(--ok); font-weight: 600; }
.fg .ax { stroke: var(--ink-2); stroke-width: 1; opacity: .55; }
.fg .tick { stroke: var(--ink-2); stroke-width: 1; }
.fg .cv { fill: none; stroke: var(--blue); stroke-width: 2.2; stroke-linejoin: round; }
.fg .cv2 { fill: none; stroke: var(--new); stroke-width: 2; }
.fg .area { fill: var(--blue); fill-opacity: .25; }
.fg .band { fill: var(--blue); fill-opacity: .12; }
.fg .band2 { fill: var(--new); fill-opacity: .14; }
.fg .dash { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 4 4; }
.fg .ch1 { stroke: var(--ok); stroke-width: 1.8; }
.fg .ch2 { stroke: var(--new); stroke-width: 1.8; }
.fg .ch3 { stroke: #a35cff; stroke-width: 1.8; }
.fg .tg { stroke: var(--ink); stroke-width: 1.6; }
.fg .tg-ok { stroke: var(--ok); stroke-width: 2.4; }
.fg .mset { stroke: var(--new); stroke-width: 5; stroke-linecap: round; }
.fg .pt { fill: var(--ink); }
.fg .pt2 { fill: var(--new); }
.fg .pt3 { fill: var(--blue); }
.fg .pt-ok { fill: var(--ok); }
.fg .hole { fill: var(--bg-alt); stroke: var(--ink); stroke-width: 1.6; }
.frow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; }
.frow input[type=range] { flex: 1 1 160px; accent-color: var(--blue); }

/* výsledky písemek */
.rgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.rcard { gap: 10px; }
.rbig { display: flex; align-items: baseline; gap: 8px; }

.prow-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.prow-main b { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.prow-main span { font-size: 14px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow-meta { display: flex; gap: 6px; align-items: center; }
.prow-ic { font-size: 11px; color: var(--ink-2); }

/* lišta stránky důkazu */
.pbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 48px); z-index: 10; background: var(--nav); border-bottom: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }

.pbar-t { flex: 1; min-width: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pbar-t b { color: var(--blue); }
.pbar-nav { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.pbar-a { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; color: var(--link); }

.pbar-a:focus-visible { outline: 2px solid var(--blue); }

/* rozvržení: obsah vlevo, důkaz vpravo */
.pp-band { padding-block: 32px 64px; }
.pp { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 220px minmax(0, 760px); gap: 40px; justify-content: center; }
.pp-rail { position: sticky; top: 124px; align-self: start; display: flex; flex-direction: column; gap: 10px; }
.pp-rail ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-left: 2px solid var(--line); }
.pp-rail a { display: block; padding: 6px 0 6px 14px; margin-left: -2px; border-left: 2px solid transparent; color: var(--ink-2); font-size: 14px; text-decoration: none; }
.pp-rail a:hover { color: var(--ink); }
.pp-rail a.on { color: var(--ink); border-left-color: var(--blue); font-weight: 600; }
.pp-main { display: flex; flex-direction: column; gap: 36px; min-width: 0; }

.seg button { all: unset; cursor: pointer; font-size: 13px; padding: 6px 12px; border-radius: 99px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-ink); box-shadow: var(--sel-ring); }
.seg button:focus-visible { outline: 2px solid var(--blue); }
@media (max-width: 980px) {

  .pp-rail > .lbl, .pp-rail ol { display: none; }

}

/* kostra = mapa důkazu */

.kostra a { display: flex; gap: 12px; align-items: baseline; padding: 8px 10px; border-radius: 10px; color: var(--ink); text-decoration: none; font-size: 15px; line-height: 1.4; }

/* kroky důkazu */
.pp-main .tl-m { background: var(--tile); }
.tl-g { list-style: none; margin: 4px 0 14px 50px; }
.tl-g span { display: inline-block; font-size: 14px; font-weight: 700; color: var(--hard); padding: 4px 10px; border-radius: 8px; background: color-mix(in srgb, var(--hard) 12%, transparent); }
.tl-g:not(:first-child) { margin-top: 14px; }
.tl-i { scroll-margin-top: 130px; border-radius: 12px; }
.tl-i.flash { animation: solflash 2s ease-out; }
.why { display: flex; gap: 10px; align-items: baseline; }
.why-l { flex: none; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ok); padding: 2px 7px; border-radius: 6px; background: color-mix(in srgb, var(--ok) 13%, transparent); }
.tl-use { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tl-use .needref { font-size: 13px; padding: 4px 10px; }
.tl.is-quiz .tl-i.hide h4 { color: var(--ink-2); }
.pp-say .say { margin: 0; font-size: 18px; line-height: 1.65; padding: 18px 22px; background: var(--tile); border-radius: 14px; box-shadow: inset 3px 0 0 var(--ok); }
.pp-done { display: flex; justify-content: center; }
.known.big { font-size: 16px; padding: 11px 24px; margin: 0; }
.pp-next { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pp-nb { all: unset; box-sizing: border-box; cursor: pointer; background: var(--tile); border-radius: 14px; padding: 12px 16px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; transition: box-shadow .15s; }
.pp-nb.nx { align-items: flex-end; text-align: right; grid-column: 2; }
.pp-nb:hover { box-shadow: inset 0 0 0 1px var(--link); }
.pp-nb:focus-visible { outline: 2px solid var(--blue); }
.pp-dir { font-size: 12px; font-weight: 600; color: var(--link); }
.pp-no { font-size: 12px; font-weight: 700; color: var(--ink-2); background: color-mix(in srgb, var(--ink) 8%, transparent); padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.pp-nb b { font-size: 16px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pp-head .pp-next { margin-top: 24px; text-align: left; }
.pp-head .pp-nb { background: var(--bg-alt); }
@media (max-width: 560px) { .pp-next { gap: 8px; } .pp-nb { padding: 10px 12px 12px; border-radius: 12px; gap: 5px; } .pp-nb b { font-size: 14px; } .pp-dir, .pp-no { font-size: 11px; } }

@media (max-width: 560px) {
  .pp-main .tl-i { grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
  .pp-main .tl-n { width: 28px; height: 28px; font-size: 14px; }
  .pp-main .tl-i::before { left: 13px; top: 28px; }
  .pp-main .tl-g { margin-left: 38px; }
  .pp-main .tl-m { padding: 2px 10px; }
  .pp-main .tl-m mjx-container, .pp-main .goal mjx-container { font-size: 86% !important; }
  .pp-main .why { flex-direction: column; gap: 4px; }
}

@media (max-width: 734px) {

/* ---------- výkon: posuvník jen u přetékajících vzorců (třídu .ovx dává markOverflow v app.js) ---------- */
.ovx { overflow-x: auto !important; overflow-y: hidden; }

/* =================== FX v1: pohyb a světlo (jen opacity/transform, bez blur pod lištami) =================== */
:root { --ease-out: cubic-bezier(.16, 1, .3, 1); --ease-io: cubic-bezier(.65, 0, .35, 1); }

/* --- vynoření při scrollu --- */
.fx .rv { opacity: 0; transform: translate3d(0, 22px, 0) scale(.985); transition: opacity .7s var(--ease-out), transform .9s var(--ease-out); transition-delay: calc(var(--d, 0) * 60ms); }
.fx .rv.in { opacity: 1; transform: none; }
.fx .tl-i.rv::before { transform: scaleY(0); transform-origin: top; transition: transform 1s var(--ease-out) .25s; }
.fx .tl-i.rv.in::before { transform: none; }
.meter i { transform-origin: left center; transition: transform 1.2s var(--ease-out) .3s; }
.fx .rv:not(.in) .meter i { transform: scaleX(0); }

/* --- úvodní pás: světelná mlha --- */
#view > section.band:first-of-type { position: relative; isolation: isolate; overflow: hidden; }
#view > section.band:first-of-type::before {
  content: ""; position: absolute; inset: -35% -20%; z-index: -1; pointer-events: none;
  background:
    radial-gradient(closest-side at 28% 42%, var(--aur1), transparent 72%),
    radial-gradient(closest-side at 72% 30%, var(--aur2), transparent 72%),
    radial-gradient(closest-side at 56% 82%, var(--aur3), transparent 72%);
  animation: fx-aurora 22s var(--ease-io) infinite alternate;
}
#view > section.band.fx-off:first-of-type::before { animation-play-state: paused; }
@keyframes fx-aurora {
  0% { transform: translate3d(-5%, -3%, 0) rotate(0deg) scale(1); }
  50% { transform: translate3d(3%, 2%, 0) rotate(6deg) scale(1.06); }
  100% { transform: translate3d(6%, -2%, 0) rotate(-4deg) scale(1.1); }
}
/* přelévající se gradient v hlavním nadpisu */
.display .grad { background-image: linear-gradient(90deg, var(--g1) 0%, var(--g2) 25%, var(--g3) 50%, var(--g2) 75%, var(--g1) 100%); background-size: 200% 100%; animation: fx-shine 9s linear infinite; }
.fx-off .display .grad { animation-play-state: paused; }
@keyframes fx-shine { to { background-position: -200% 0; } }

/* --- tenký ukazatel postupu stránkou pod horní lištou --- */
@supports (animation-timeline: scroll()) {
  .gnav::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--grad); transform-origin: 0 50%; transform: scaleX(0); animation: fx-progress linear both; animation-timeline: scroll(root block); pointer-events: none; }
  @keyframes fx-progress { to { transform: scaleX(1); } }
}

/* --- tlačítka: jemné zvednutí, záře a odlesk --- */
.pill { position: relative; overflow: hidden; transition: transform .25s var(--ease-out), box-shadow .35s var(--ease-out), filter .2s; }
.pill:not(.ghost):not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 10px 28px -10px color-mix(in srgb, var(--blue) 80%, transparent); }
.pill.end:not(:disabled):hover { box-shadow: 0 10px 28px -10px color-mix(in srgb, var(--new) 80%, transparent); }
.pill:not(:disabled):active { transform: scale(.97); }
.pill::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .32) 50%, transparent 70%); transform: translateX(-120%); }
.pill:not(:disabled):hover::after { transform: translateX(120%); transition: transform .8s var(--ease-out); }
.more { transition: color .2s; }
.more::after { display: inline-block; transition: transform .3s var(--ease-out); }
.more:hover::after { transform: translateX(3px); }

/* --- dlaždice a karty: světlo pod kurzorem, zvednutí, svítící okraj --- */
.tile, .tcard, .step3, .pp-nb, .prow, .rcard { transition: transform .45s var(--ease-out), box-shadow .45s var(--ease-out); }
@media (hover: hover) and (pointer: fine) {
  .tile:hover, .tcard:hover, .step3:hover, .pp-nb:hover, .rcard:hover {
    transform: translateY(-4px);
    background-image: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--blue) 16%, transparent), transparent 62%);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--blue) 45%, transparent), 0 24px 48px -28px color-mix(in srgb, var(--blue) 60%, transparent);
  }
  .prow:hover { transform: translateX(3px); background-image: radial-gradient(360px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--blue) 13%, transparent), transparent 65%); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--blue) 45%, transparent); }
  .tcard.hard:hover { background-image: radial-gradient(360px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--hard) 18%, transparent), transparent 62%); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--hard) 55%, transparent); }
}
.chip { transition: box-shadow .2s, background-color .2s, color .2s, transform .2s var(--ease-out); }
.chip:active { transform: scale(.96); }

/* --- přechody mezi stránkami (View Transitions) --- */
.gnav { view-transition-name: gnav; }
::view-transition-group(gnav), ::view-transition-old(gnav), ::view-transition-new(gnav),
::view-transition-group(tabbar), ::view-transition-old(tabbar), ::view-transition-new(tabbar) { animation: none; }
::view-transition-old(root) { animation: fx-out .26s cubic-bezier(.4, 0, 1, 1) both; }
::view-transition-new(root) { animation: fx-in .5s var(--ease-out) both; }
html[data-vt="next"]::view-transition-old(root) { animation-name: fx-out-l; }
html[data-vt="next"]::view-transition-new(root) { animation-name: fx-in-r; }
html[data-vt="prev"]::view-transition-old(root) { animation-name: fx-out-r; }
html[data-vt="prev"]::view-transition-new(root) { animation-name: fx-in-l; }
html[data-vt="back"]::view-transition-new(root) { animation-name: fx-in-back; }
@keyframes fx-out { to { opacity: 0; transform: translate3d(0, -12px, 0) scale(.99); } }
@keyframes fx-in { from { opacity: 0; transform: translate3d(0, 18px, 0) scale(.99); } }
@keyframes fx-in-back { from { opacity: 0; transform: scale(1.015); } }
@keyframes fx-out-l { to { opacity: 0; transform: translate3d(-40px, 0, 0); } }
@keyframes fx-in-r { from { opacity: 0; transform: translate3d(48px, 0, 0); } }
@keyframes fx-out-r { to { opacity: 0; transform: translate3d(40px, 0, 0); } }
@keyframes fx-in-l { from { opacity: 0; transform: translate3d(-48px, 0, 0); } }

/* --- kdo nechce pohyb, nemá pohyb --- */
@media (prefers-reduced-motion: reduce) {
  #view > section.band:first-of-type::before, .display .grad { animation: none; }
  .gnav::after { display: none; }
  .pill::after { display: none; }
  .tile, .tcard, .step3, .pp-nb, .prow, .rcard, .pill { transition: none; }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
}

/* =================== logo / tlačítko domů =================== */
.brand { display: inline-flex; align-items: center; gap: 10px; padding: 4px 10px 4px 4px; margin-left: -4px; border-radius: 12px; font-size: 15px; transition: background-color .25s; }
.brand:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.brand:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.bm { position: relative; flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--ink);
  background: linear-gradient(180deg, color-mix(in srgb, var(--ink) 7%, var(--bg)) 0%, var(--bg) 100%);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 15%, transparent), 0 1px 2px rgba(0, 0, 0, .08);
  transition: box-shadow .3s, transform .3s var(--ease-out, ease); }
.bm svg { width: 24px; height: 24px; overflow: visible; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
.bm-cur { stroke-width: 2.1; }
.bm-tan { stroke-width: 1.3; opacity: .4; }
.bm-dot { fill: var(--blue); stroke: none; }
.bt { display: flex; flex-direction: column; line-height: 1.08; text-align: left; }
.bt b { font-size: 15px; font-weight: 650; letter-spacing: -.015em; }
.bt small { font-size: 10.5px; font-weight: 500; letter-spacing: .01em; color: var(--ink-2); }
@media (hover: hover) {
  .brand:hover .bm { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 28%, transparent), 0 2px 8px rgba(0, 0, 0, .12); }
  .brand:hover .bm-cur { animation: bm-draw .8s var(--ease-out, ease) both; }
  .brand:hover .bm-dot { animation: bm-pop .45s .4s var(--ease-out, ease) both; }
}
.brand:active .bm { transform: scale(.95); transition-duration: .12s; }
@keyframes bm-draw { from { stroke-dasharray: 1; stroke-dashoffset: 1; } to { stroke-dasharray: 1; stroke-dashoffset: 0; } }
@keyframes bm-pop { 0% { transform: scale(0); } 70% { transform: scale(1.35); } 100% { transform: scale(1); } }
.bm-dot { transform-box: fill-box; transform-origin: center; }
@media (max-width: 734px) { .brand { margin-left: -4px; } }
@media (prefers-reduced-motion: reduce) { .bm, .brand { transition: none; } .brand:hover .bm-cur, .brand:hover .bm-dot { animation: none; } .brand:hover .bm { transform: none; } }

/* =================== karty: obrys a jemný stín (ve světlém motivu; ve tmavém průhledné) =================== */
.band:not(.alt):not(.dark) { --tile: var(--tile-on-bg); }

/* =================== klíčové pojmy (ústní) =================== */
.kp-toc { margin-top: 4px; }
.kp-list { display: flex; flex-direction: column; gap: 20px; }
.kp { scroll-margin-top: 72px; gap: 14px; }
.kp-h { display: flex; align-items: center; gap: 12px; }
.kp-n { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 15px; background: color-mix(in srgb, var(--blue) 12%, transparent); color: var(--link); }
.kp .lbl { display: block; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px; }
.kp-def { box-shadow: inset 3px 0 0 var(--blue), var(--card-edge); }

    padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--bg); overflow-y: auto; z-index: 30; }

/* =================== jednotná tlačítka ===================
   Hlavní akce: plné modré „pill“. Vedlejší akce: světle modrý podklad, modrý text, bez obrysu.
   Odkaz: modrý tučný text se šipkou ›. Přepínače a filtry: stejné zaoblení a výška, vybraný = světle modrý. */
:root { --btn-h: 44px; --btn-h-sm: 34px; --btn-2: color-mix(in srgb, var(--blue) 11%, transparent); --btn-2h: color-mix(in srgb, var(--blue) 19%, transparent); }

.pill.ghost:not(:disabled):hover { background: var(--btn-2h); filter: none; }

.more { font-size: 15px; font-weight: 600; }
.tile .more, .otile .more { font-size: 15px; }

.known:hover { background: var(--btn-2h); }
.known[aria-pressed="true"] { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.known.big { min-height: var(--btn-h); padding: 0 24px; font-size: 15px; }
.needref { display: inline-flex; align-items: center; box-sizing: border-box; min-height: var(--btn-h-sm); padding: 0 14px; font-size: 14px; font-weight: 500; background: var(--btn-2); }
.needref:hover { background: var(--btn-2h); }

/* deterministický generátor náhodných čísel (stejné semínko = stejný příklad) */
function rng(seed) {
  let s = (seed >>> 0) || 1;
  const r = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  r(); r();
  r.int = (a, b) => a + Math.floor(r() * (b - a + 1));
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  return r;
}

/* čísla po česku: desetinná čárka, mezera mezi tisíci */
function num(x, d = 2) {
  if (!isFinite(x)) return String(x);
  let v = Math.round(x * 10 ** d) / 10 ** d;
  if (Object.is(v, -0)) v = 0;
  let [i, f] = Math.abs(v).toFixed(d).split('.');
  f = (f || '').replace(/0+$/, '');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (v < 0 ? '−' : '') + i + (f ? ',' + f : '');
}
