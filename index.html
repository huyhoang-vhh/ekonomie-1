    if (v.typ === 'cd') {
      lv.forEach((U, i) => { s += g.cur(g.fn(x => U / x, U / 20, 20, 120), i === 1 ? 'D' : 'K', i !== 1) + g.lab(19.5, U / 19.5, 'U = ' + Math.sqrt(U), i === 1 ? 'D' : 'K', 'end', 0, -8); });
      const x = clamp(v.x, 3.3, 19), y = 64 / x, m = y / x;
      s += g.clip(g.line(x - 4, y + 4 * m, x + 4, y - 4 * m, 'tg')) + g.dot(x, y) + g.lab(x, y, `MRS = ${n2(m)}`, 'R', 'start', 10, -10);
      st = `Na křivce U = 8 (x₁x₂ = 64) je v bodě (${n1(x)}; ${n1(y)}) MRS = x₂/x₁ = <b>${n2(m)}</b>. Posuň bod doprava: MRS klesá, protože čím víc x₁ máš, tím méně x₂ jsi za další jednotku ochoten dát. Proto je křivka <b>konvexní</b>.`;
    } else if (v.typ === 's') { [6, 10, 14].forEach((c, i) => { s += g.cur(g.P([[0, c], [c, 0]]), i === 1 ? 'D' : 'K', i !== 1); }); st = 'Dokonalé substituty (stokoruny a tisícikoruny): indiferenční křivky jsou <b>přímky</b>, MRS je konstantní.'; }
    else { [4, 7, 10].forEach((c, i) => { s += g.cur(g.P([[c, 19], [c, c], [19, c]]), i === 1 ? 'D' : 'K', i !== 1) + g.dot(c, c, 'dt o', 3.5); }); st = 'Dokonalé komplementy (levá a pravá bota): křivky ve tvaru <b>L</b>. Bota navíc bez páru užitek nezvýší.'; }
    return svgWrap(s) + stat(st + ' Vyšší křivka = vyšší užitek; křivky se nikdy neprotínají.');
  } };

FIGDEF.budget = { opt: [['tr', 'Stopa', [['n', 'nic'], ['icc', 'důchodová ICC'], ['pcc', 'cenová PCC']], 'n']], ctl: [['Y', 'Důchod Y', 40, 160, 4, 100], ['p1', 'Cena statku 1 (p₂ = 4)', 1, 8, 0.25, 4]],
  steps: [['Optimum', { Y: 100, p1: 4, tr: 'n' }, 'Rozpočtová přímka se dotýká nejvyšší dosažitelné indiferenční křivky. V bodě dotyku MRS = p₁/p₂.'], ['Důchod ↑', { Y: 148, tr: 'icc' }, 'Vyšší důchod posune přímku rovnoběžně ven. Optima leží na důchodové spotřební křivce ICC.'], ['Cena p₁ ↓', { Y: 100, p1: 2, tr: 'pcc' }, 'Zlevnění statku 1 přímku pootočí kolem průsečíku s osou x₂. Optima leží na cenové spotřební křivce PCC; z ní plyne poptávka po statku 1.']],
  draw(v) {

    if (moved) s += g.cur(g.P([[25, 0], [0, 25]]), 'K', true) + g.dot(12.5, 12.5, 'dt o');
    s += g.poly([[0, 0], [Math.min(52, v.Y / v.p1), Math.max(0, v.Y / p2 - v.p1 / p2 * Math.min(52, v.Y / v.p1))], [0, v.Y / p2]], 'a-el')
      + g.cur(g.P([[Math.min(52, v.Y / v.p1), Math.max(0, v.Y / p2 - v.p1 / p2 * Math.min(52, v.Y / v.p1))], [0, v.Y / p2]]), 'S') + g.cur(g.fn(x => U / x, U / 32, 52, 120), 'D')

FIGDEF.engel = { opt: [['g', 'Statek', [['n', 'nezbytný'], ['l', 'luxusní'], ['i', 'podřadný']], 'n']], ctl: [['Y', 'Důchod Y', 10, 100, 1, 40]],

FIGDEF.sie = { opt: [['g', 'Statek x₁', [['n', 'normální'], ['i', 'podřadný'], ['gf', 'Giffenův']], 'n']], hid: { k: 3 },
  steps: [['E₁ výchozí', { k: 0 }, 'Výchozí optimum E₁: rozpočtová přímka se dotýká indiferenční křivky I.'], ['Cena p₁ klesne', { k: 1 }, 'Zlevnění x₁ pootočí rozpočtovou přímku ven kolem průsečíku s osou x₂.'], ['Substituční efekt', { k: 2 }, 'Pomocná (čárkovaná) přímka má nové relativní ceny, ale dotýká se původní křivky I v E₂. Pohyb E₁ → E₂ je substituční efekt: vždy ve prospěch zlevněného statku.'], ['Důchodový efekt', { k: 3 }, 'Posun E₂ → E₃ na vyšší křivku je důchodový efekt (vzrostl reálný důchod). Celkový efekt E₁ → E₃ = SE + IE.']],
  draw(v) {

    const ic = (P, ratio, c, dashed) => { const C = P[1] * P[0] ** ratio; return g.cur(g.fn(x => C / x ** ratio, 1, 42, 140), c, dashed); };

    s += g.dot(E1[0], E1[1]) + g.lab(E1[0], E1[1], 'E₁', 'K', 'end', -8, -6) + g.lab(38, 200 / 38, 'I', 'D', 'end', 0, -8);

    const se = E2[0] - E1[0], ie = E3[0] - E2[0];

FIGDEF.prod = { ctl: [['L', 'Počet pracovníků L', 0.5, 9.5, 0.1, 3]],
  steps: [['I. stádium', { L: 3 }, 'MP > AP: každý další pracovník zvedne průměr. Vyplatí se přidávat (stroj je zatím nevyužitý).'], ['Max MP', { L: 4 }, 'Při L = 4 je MP největší (inflexní bod TP). Odtud platí zákon klesajícího mezního produktu.'], ['MP = AP', { L: 6 }, 'Při L = 6 protíná MP průměrný produkt v jeho maximu. Začíná II. stádium, racionální oblast výroby.'], ['MP = 0', { L: 8 }, 'Při L = 8 je TP maximální a MP = 0. Další pracovník už nic nepřidá.'], ['III. stádium', { L: 9.2 }, 'MP < 0: lidé si překážejí, celkový produkt klesá. Tady se nevyrábí.']],
  draw(v) {
    const TP = L => 6 * L * L - L ** 3 / 2, MP = L => 12 * L - 1.5 * L * L, AP = L => 6 * L - L * L / 2, L = v.L;
    const g = plane(10, 140, { h: 300 }), h = plane(10, 26, { h: 260, m: { l: 58, r: 28, t: 16, b: 46 } });
    const st = (p, H) => p.shade(0, 6, 'stg1') + p.shade(6, 8, 'stg2') + p.shade(8, 10, 'stg3') + p.txt(3, p.ymax, 'I. stádium', 'stt', 'middle', 0, 16) + p.txt(7, p.ymax, 'II.', 'stt', 'middle', 0, 16) + p.txt(9, p.ymax, 'III.', 'stt', 'middle', 0, 16);
    const top = svgWrap(st(g) + g.axes('L', 'celkový produkt TP', [4, 6, 8], [64, 108, 128]) + g.clip(g.cur(g.fn(TP, 0, 9.8, 120), 'D') + g.line(L - 1.6, TP(L) - 1.6 * MP(L), L + 1.6, TP(L) + 1.6 * MP(L), 'tg') + g.line(0, 0, 10, 10 * AP(L), 'ray'))
      + g.dot(L, TP(L)) + g.lab(9.7, TP(9.7), 'TP', 'D', 'end', 0, -10) + g.lab(L, TP(L), 'tečna: sklon = MP', 'K', 'end', -10, -10), FW, 300);
    const bot = svgWrap(st(h) + h.axes('L', 'AP, MP', [4, 6, 8], [18, 24]) + h.clip(h.cur(h.fn(AP, 0, 10, 100), 'G') + h.cur(h.fn(MP, 0, 9.6, 100), 'M'))
      + h.dot(6, AP(6), 'dt o') + h.lab(6, AP(6), 'MP = AP', 'K', 'start', 8, -8) + h.dot(4, MP(4), 'dt o') + h.lab(4, MP(4), 'max MP', 'K', 'middle', 0, -12)
      + h.lab(9.6, AP(9.6), 'AP', 'G', 'end', 0, -8) + h.lab(8.7, MP(8.7), 'MP', 'M', 'end', -6, 0) + h.line(L, 0, L, 25, 'reg') + h.dot(L, AP(L), 'dt', 4) + h.dot(L, Math.max(0, MP(L)), 'dt', 4), FW, 260);
    const s = L < 6 ? 'I. stádium (AP roste)' : L <= 8 ? 'II. stádium (AP klesá, MP > 0): racionální výroba' : 'III. stádium (MP < 0)';
    return top + bot + stat(`TP = 6L² − L³/2. Při L = ${n1(L)}: TP = <b>${n1(TP(L))}</b>, AP = TP/L = <b>${n1(AP(L))}</b>, MP = <b>${n1(MP(L))}</b> → ${s}. Sklon tečny je MP, sklon tenké čáry z počátku je AP.`);
  } };

FIGDEF.isoq = { opt: [['t', 'Produkční funkce', [['cd', 'Cobb-Douglasova'], ['l', 'lineární'], ['lt', 'Leontiefova']], 'cd']], ctl: [['x', 'Bod na izokvantě (práce L)', 2, 18, 0.2, 6]],

      const x = clamp(v.x, 3.3, 19), y = 64 / x, m = y / x; s += g.clip(g.line(x - 4, y + 4 * m, x + 4, y - 4 * m, 'tg')) + g.dot(x, y) + g.lab(x, y, 'MRTS = ' + n2(m), 'R', 'start', 10, -10);

/* ---------- motor: ovládání, kroky a animace ---------- */
function initFigs(root) {
  const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { const s = e.target.querySelector('svg'); if (s && !reduceMotion()) { s.classList.add('intro'); } io.unobserve(e.target); } }), { threshold: .35 }) : null;
  root.querySelectorAll('figure[data-fig]').forEach(f => {
    const def = FIGDEF[f.dataset.fig]; if (!def || f.dataset.ok) return; f.dataset.ok = 1;
    const ctl = def.ctl || [], opt = def.opt || [], steps = def.steps || [];
    const base = Object.assign({}, def.hid || {}, ...ctl.map(c => ({ [c[0]]: c[5] })), ...opt.map(o => ({ [o[0]]: o[3] }))), optK = new Set(opt.map(o => o[0])), isNum = k => typeof base[k] === 'number' && !optK.has(k);
    const val = { ...base }, dec = s => (String(s).split('.')[1] || '').length;
    const cap = f.querySelector('figcaption'); const capHTML = cap ? cap.outerHTML : '';
    f.innerHTML = (steps.length ? `<div class="fsteps" role="group" aria-label="Kroky výkladu">${steps.map((s, i) => `<button type="button" class="fstep" data-s="${i}"><b>${i + 1}</b>${s[0]}</button>`).join('')}<button type="button" class="fplay" data-play>▶ Přehrát</button></div><div class="fnote" aria-live="polite" hidden></div>` : '')
      + `<div class="fbox"></div>`
      + (ctl.length || opt.length ? `<div class="fctl">${opt.map(([k, l, ch]) => `<div class="fopt"><span>${l}</span><div class="seg">${ch.map(([cv, ct]) => `<button type="button" data-ok="${k}" data-ov="${cv}">${ct}</button>`).join('')}</div></div>`).join('')}${ctl.map(([k, l, a, b, s]) => `<label><span>${l.replace(/_(\w)/, '<sub>$1</sub>')}: <b data-o="${k}"></b></span><input type="range" min="${a}" max="${b}" step="${s}" data-k="${k}"></label>`).join('')}<button type="button" class="chip" data-reset>↺ Výchozí</button></div>` : '')
      + capHTML;
    const box = f.querySelector('.fbox'), note = f.querySelector('.fnote');
    const sync = () => { ctl.forEach(([k, , , , s]) => { const i = f.querySelector(`[data-k="${k}"]`), o = f.querySelector(`[data-o="${k}"]`); if (i) i.value = val[k]; if (o) o.textContent = num(val[k], dec(s)); });
      f.querySelectorAll('[data-ok]').forEach(b => b.setAttribute('aria-pressed', String(val[b.dataset.ok]) === b.dataset.ov)); };
    const draw = () => { box.innerHTML = def.draw(val); if (/\\\(/.test(box.innerHTML) && window.typeset) typeset(box); };
    let anim = 0, playing = false;
    const tween = tgt => new Promise(res => {
      cancelAnimationFrame(anim); const from = { ...val }, t0 = performance.now(), ms = 800;
      for (const k in tgt) if (!isNum(k)) val[k] = tgt[k];
      if (reduceMotion()) { Object.assign(val, tgt); sync(); draw(); return res(); }
      const tick = now => { let u = Math.min(1, (now - t0) / ms); u = u < .5 ? 4 * u * u * u : 1 - (-2 * u + 2) ** 3 / 2;
        for (const k in tgt) if (isNum(k)) val[k] = from[k] + (tgt[k] - from[k]) * u;
        draw(); sync(); if (u < 1) anim = requestAnimationFrame(tick); else res(); };
      anim = requestAnimationFrame(tick);
    });
    const showStep = i => { f.querySelectorAll('.fstep').forEach((b, j) => b.setAttribute('aria-current', j === i ? 'step' : 'false')); if (note) { note.hidden = false; note.innerHTML = `<b>${i + 1}. ${steps[i][0]}.</b> ${steps[i][2]}`; } return tween(steps[i][1]); };
    const stopPlay = () => { playing = false; const b = f.querySelector('[data-play]'); if (b) b.textContent = '▶ Přehrát'; };
    f.addEventListener('click', async e => {
      const st = e.target.closest('[data-s]'); if (st) { stopPlay(); showStep(+st.dataset.s); return; }
      if (e.target.closest('[data-play]')) {
        if (playing) { stopPlay(); return; }
        playing = true; e.target.closest('[data-play]').textContent = '❚❚ Zastavit';
        Object.assign(val, base); sync(); draw();
        for (let i = 0; i < steps.length && playing; i++) { await showStep(i); await new Promise(r => setTimeout(r, 2600)); }
        stopPlay(); return;
      }
      const ob = e.target.closest('[data-ok]'); if (ob) { stopPlay(); const k = ob.dataset.ok; val[k] = typeof base[k] === 'number' ? +ob.dataset.ov : ob.dataset.ov; sync(); draw(); return; }
      if (e.target.closest('[data-reset]')) { stopPlay(); if (note) note.hidden = true; f.querySelectorAll('.fstep').forEach(b => b.setAttribute('aria-current', 'false')); tween({ ...base }); }
    });
    f.addEventListener('input', e => { const k = e.target.dataset.k; if (k) { stopPlay(); cancelAnimationFrame(anim); val[k] = +e.target.value; sync(); draw(); } });
    sync(); draw(); if (io) io.observe(f);
  });
}

[5, 'Indiferenční křivky jednoho spotřebitele se nemohou protínat, protože', ['by to odporovalo zákonu poptávky', 'by to porušilo tranzitivitu preferencí a předpoklad, že víc je lepší', 'mohou se protnout u Giffenova statku', 'mohou se protnout u luxusních statků', 'nic z uvedeného'], 1, 'Průsečík by znamenal, že jeden koš je stejně dobrý jako dva různé koše, z nichž jeden obsahuje víc obou statků.', 'z'],

[5, 'Důchodová spotřební křivka (ICC) se s růstem důchodu stáčí tak, že spotřeba x₂ klesá. To znamená, že', ['x₂ je luxusní statek', 'x₂ je podřadný statek', 'x₂ je Giffenův statek', 'x₁ je podřadný statek', 'x₂ je nezbytný statek'], 1, 'Statek, jehož spotřeba s důchodem klesá, je podřadný (YED < 0).', 'z'],

/* ===== 7 Zisk a náklady ===== */
[7, 'Tržby 2 mil. Kč, explicitní náklady 1,5 mil. Kč. Majitel opustil práci s platem 400 tis. Kč a vložil vlastní 1 mil. Kč, který by jinde vynesl 5 %. Ekonomický zisk je', ['500 tis. Kč', '100 tis. Kč', '50 tis. Kč', '−50 tis. Kč', '0'], 2, 'Účetní zisk 500 tis. minus implicitní náklady 400 tis. a 50 tis. = 50 tis. Kč.', 'z'],
[7, 'Cena výrobku je 20 Kč, mezní produkt pátého pracovníka 6 kusů, mzda 100 Kč. Firma maximalizující zisk pátého pracovníka', ['nepřijme, protože mzda je vyšší než mezní produkt', 'přijme, protože hodnota jeho mezního produktu 120 Kč převyšuje mzdu', 'přijme, jen pokud klesne mzda', 'je jí to lhostejné', 'nelze určit bez fixních nákladů'], 1, '\\(p \\cdot MP = 20 \\cdot 6 = 120 > w = 100\\): pracovník přinese víc, než stojí.', 'z'],
[7, 'Produkční funkce \\(q = 20\\sqrt{L}\\), cena výrobku 5, mzda 25. Optimální počet pracovníků je', ['2', '4', '8', '16', '25'], 1, '\\(MP = 10/\\sqrt{L}\\). \\(p \\cdot MP = w\\): \\(50/\\sqrt{L} = 25 \\Rightarrow L = 4\\).', 'z'],
[7, 'Mezní produkt práce je 10 a mzda 5; mezní produkt kapitálu je 30 a jeho cena 10. Firma minimalizující náklady by měla', ['použít víc práce a méně kapitálu', 'použít víc kapitálu a méně práce', 'nic neměnit', 'snížit oba vstupy', 'nelze určit'], 1, 'MP na korunu: práce 10/5 = 2, kapitál 30/10 = 3. Koruna v kapitálu přinese víc, přesune se tedy ke kapitálu.', 'z'],
[7, 'Mzda je 20, úrok 10, práce L je na vodorovné ose. Sklon izokosty je', ['−0,5', '−2', '2', '−200', '−10'], 1, 'Sklon \\(= -w/r = -20/10 = -2\\).', 'z'],
[7, 'Produkční funkce \\(Q = 2L + K\\), mzda 10, cena kapitálu 4. Firma minimalizující náklady', ['použije jen práci', 'použije jen kapitál', 'použije oba vstupy ve stejném poměru', 'použije práci a kapitál v poměru 2 : 1', 'nelze určit'], 1, 'Výstup na korunu: práce 2/10 = 0,2, kapitál 1/4 = 0,25. Lineární technologie ⇒ rohové řešení, jen efektivnější vstup.', 'z'],
[7, 'Leontiefova funkce \\(q = \\min(2L, K)\\). Firma chce vyrobit 40 jednotek s minimálními náklady. Použije', ['L = 40, K = 40', 'L = 20, K = 40', 'L = 40, K = 20', 'L = 10, K = 40', 'L = 20, K = 20'], 1, 'V optimu \\(2L = K = 40\\): L = 20, K = 40. Navíc kteréhokoli vstupu je plýtvání.', 'z'],
[7, 'Firma používá vstupy tak, že poměr mezního produktu k ceně je u všech vstupů stejný. Pak vyrábí svůj výstup', ['s minimálními náklady a zároveň s maximálním ziskem', 's minimálními náklady; tento výstup může, ale nemusí maximalizovat zisk', 's maximálním ziskem, ale ne nutně s minimálními náklady', 'ani s minimálními náklady, ani s maximálním ziskem', 'nic z uvedeného'], 1, 'Podmínka MP₁/w₁ = MP₂/w₂ zaručí nejlevnější výrobu daného výstupu. Zda je to výstup s maximálním ziskem, závisí na ceně (reciprocita).', 'z'],
[7, 'V rozvaze podniku musí platit', ['aktiva = pasiva − vlastní kapitál', 'aktiva = pasiva (vlastní kapitál + cizí zdroje)', 'zisk = tržby − odpisy', 'aktiva = vlastní kapitál − dluh', 'nic z uvedeného'], 1, 'Aktiva ukazují, co firma vlastní, pasiva, z čeho to financovala. Obě strany se rovnají.', 'z'],
[7, 'Výsledovka (výkaz zisku a ztrát) zachycuje', ['stav aktiv a pasiv k určitému dni', 'výnosy a náklady za určité období', 'jen peněžní příjmy a výdaje', 'tržní hodnotu akcií', 'nic z uvedeného'], 1, 'Rozvaha je stav k datu, výsledovka tok za období, cash-flow peněžní toky.', 'z'],
[7, 'Cena výrobku vzroste, mzda se nezmění. Izoziskové přímky (jeden vstup) a optimum', ['se nezmění', 'zploští se (sklon w/p klesne) a firma najme víc práce', 'zestrmí se a firma najme méně práce', 'posunou se dolů rovnoběžně', 'nic z uvedeného'], 1, 'Sklon izozisku je w/p. Vyšší p ⇒ plošší přímky ⇒ dotyk dál vpravo na produkční funkci.', 'z'],
[7, 'Ceny všech vstupů vzrostou o stejné procento. Izokosty', ['nezmění sklon', 'zestrmí se', 'zploští se', 'se pootočí kolem počátku', 'nic z uvedeného'], 0, 'Sklon −w₁/w₂ závisí jen na poměru cen, který zůstal stejný. Pro stejné náklady se ale posunou k počátku.', 'z'],

[7, 'Firma maximalizuje zisk s jedním variabilním vstupem. V optimu platí', ['MP = w', 'p · MP = w (hodnota mezního produktu = cena vstupu)', 'AP = w/p', 'p = w', 'MP = 0'], 1, 'Dotyk nejvyšší izoziskové přímky s produkční funkcí: MP = w/p, neboli MR = MC.', 'z'],

/* ---------- početní příklady: šablony s náhodnými čísly ----------

const argmax = (f, a, b, n = 20000) => { let bx = a, bv = -Infinity; for (let i = 0; i <= n; i++) { const x = a + (b - a) * i / n, v = f(x); if (v > bv) { bv = v; bx = x; } } return bx; };

const FAM_IDS = Object.keys(FAM);
function makeProblem(id, seed) { const r = rng(seed * 7919 + id.charCodeAt(0) * 131 + id.charCodeAt(1)); return Object.assign({ id, seed, l: FAM[id].l, title: FAM[id].title }, FAM[id].make(r)); }
/* početní příklad jako otázka s výběrem z 5 možností (pro testy) */
function problemAsMC(p, r) {
  const fmt = x => num(x, p.dp ?? 2) + (p.unit ? ' ' + p.unit : '');
  const right = fmt(p.ans), opts = [right];
  for (const w of p.wrong || []) { const s = fmt(w); if (isFinite(w) && !opts.includes(s) && opts.length < 5) opts.push(s); }
  let k = 1; while (opts.length < 5 && k < 50) { const f = [1.5, 0.5, 2, 0.75, 1.25, 3][k % 6] * (k > 6 ? 1 + k / 20 : 1), s = fmt(p.ans === 0 ? k : p.ans * f); if (!opts.includes(s)) opts.push(s); k++; }
  const sh = r.shuffle(opts);
  return { l: p.l, q: p.task, o: sh, a: sh.indexOf(right), why: `<ol>${p.sol.map(s => `<li>${s}</li>`).join('')}</ol>`, num: true };
}
window.selfTest = function (seeds = 60) {
  const bad = [];
  for (const id of FAM_IDS) for (let s = 0; s < seeds; s++) {
    let p; try { p = makeProblem(id, s); } catch (e) { bad.push({ id, s, err: String(e) }); continue; }
    const mc = problemAsMC(p, rng(s + 1));
    if (!isFinite(p.ans) || !p.check() || !p.sol?.length || new Set(mc.o).size !== 5 || mc.a < 0) bad.push({ id, s, ans: p.ans, ok: p.check(), opts: mc.o });
  }
  let qbad = QB.filter(q => !(q[2].length >= 4 && q[3] >= 0 && q[3] < q[2].length && q[4])).length;
  return { checked: FAM_IDS.length * seeds, nBad: bad.length, bad: bad.slice(0, 10), questions: QB.length, qbad };
};

/* ---------- FX: přechody mezi stránkami, odhalování při scrollu, světlo pod kurzorem, počítání čísel ----------
   Jen opacity a transform (běží na GPU, neblokují scroll). Při prefers-reduced-motion se nic nehýbe. */
const FX_ON = () => !reduceMotion();
document.documentElement.classList.toggle('fx', FX_ON());

/* co se při příchodu do obrazovky jemně vynoří (vnořené prvky se neanimují dvakrát) */
const RV_SEL = [
  '#view > section.band:first-of-type .inner > *',
  '.tile', '.step3', '.stat', '.tcard', '.list > .card', '.prow', '.pch > .row-h', '.plearn li',
  '.thm', '.topic > h2', '.note', '.rcard', '.tbl', '.hardsub', '.pp-nb', '.endpanel', '.score',
  '.pp-h', '.stmt', '.kostra', '.pv-idea', '.tl-i', '.tl-g', '.say', '.pp-done', 'figure', '.hp', '.otile', '.kc', '.ptopic'
].join(', ');
let heroObs = null;

function fxCount(el) {
  /* čísla v textu naběhnou od nuly (jen celá čísla do 9999) */
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
  while (walker.nextNode()) if (/\d/.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const src = n.nodeValue, nums = src.match(/\d+/g) || [];
    if (!nums.length || nums.some(x => +x > 9999)) continue;
    const t0 = performance.now(), dur = 900;
    const step = t => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      let i = 0; n.nodeValue = src.replace(/\d+/g, m => String(Math.round(+nums[i++] * e)));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
}

function fxDone(el) { el.classList.remove('rv', 'in'); el.style.removeProperty('--d'); }

/* čekající prvky: odhalí je kontrola při scrollu (bez IntersectionObserveru a rAF, aby obsah nikdy nezůstal schovaný) */
let rvPending = [], rvT = 0;
function rvCheck() {
  rvT = 0; if (!rvPending.length) return;
  const lim = window.innerHeight * 0.97, show = [], keep = [];
  for (const el of rvPending) {
    if (!el.isConnected) continue;
    const r = el.getBoundingClientRect();
    (r.top < lim ? show : keep).push([el, r.top, r.left]);
  }
  rvPending = keep.map(x => x[0]);
  show.sort((a, b) => a[1] - b[1] || a[2] - b[2]).forEach(([el], k) => {
    el.style.setProperty('--d', Math.min(k, 7));
    el.classList.add('in');
    if (el.matches('.tile')) fxCount(el.querySelector('.big') || el);
    else if (el.matches('.stat')) fxCount(el.querySelector('b') || el);
    else if (el.matches('.display')) fxCount(el.querySelector('.grad') || el);
    const end = ev => { if (ev.target === el && !ev.pseudoElement && ev.propertyName === 'opacity') { fxDone(el); el.removeEventListener('transitionend', end); } };
    el.addEventListener('transitionend', end);
    setTimeout(() => fxDone(el), 1700); /* pojistka, kdyby transitionend nepřišel */
  });
}
const rvSoon = () => { if (!rvT) rvT = setTimeout(rvCheck, 40); };
window.addEventListener('scroll', rvSoon, { passive: true });
window.addEventListener('resize', rvSoon, { passive: true });

function fxReveal(root) {
  if (!FX_ON() || !root) return;
  const els = [...root.querySelectorAll(RV_SEL)];
  const set = new Set(els);
  rvPending = [];
  for (const el of els) {
    let p = el.parentElement, nested = false;
    while (p && p !== root) { if (set.has(p)) { nested = true; break; } p = p.parentElement; }
    if (nested || el.offsetParent === null) continue;
    el.classList.add('rv'); rvPending.push(el);
  }
  /* první várka až po vykreslení výchozího stavu, aby přechod opravdu proběhl */
  setTimeout(rvCheck, 60);
  /* úvodní pás: animace pozadí běží, jen když je vidět */
  const hero = root.querySelector(':scope > section.band');
  heroObs?.disconnect();
  if (hero && 'IntersectionObserver' in window) {
    heroObs = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('fx-off', !e.isIntersecting)));
    heroObs.observe(hero);
  }
}

/* přechod mezi stránkami (View Transitions API, kde je k dispozici) */
const routeIndex = v => { const t = v.match(TEST_RE); return t ? +t[2] : null; };
function fxGo(from, to, restore, doIt) {
  if (!FX_ON() || !document.startViewTransition || from === to) { doIt(); return; }
  const a = routeIndex(from), b = routeIndex(to), same = TEST_RE.test(from) && TEST_RE.test(to);
  document.documentElement.dataset.vt = same && a != null && b != null ? (b > a ? 'next' : 'prev') : restore ? 'back' : 'fwd';
  /* pojistka: když prohlížeč snímek nepořídí (skrytá karta, rám), přepni stránku i tak, jen bez animace */
  let ran = false; const once = () => { if (ran) return; ran = true; doIt(); };
  let vt = null;
  try { vt = document.startViewTransition(once); } catch { once(); return; }
  /* přeskočený přechod (rychlé klikání, pojistka níž) není chyba, jen ho neohlašuj do konzole */
  for (const pr of [vt.ready, vt.finished, vt.updateCallbackDone]) pr && pr.catch(() => { });
  setTimeout(() => { if (!ran) { try { vt && vt.skipTransition(); } catch { } once(); } }, 350);
}

/* světlo pod kurzorem na dlaždicích */
if (window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches) {
  let raf = 0, last = null;
  document.addEventListener('pointermove', e => {
    last = e; if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0; const ev = last;
      const el = ev.target.closest && ev.target.closest('.tile, .tcard, .step3, .pp-nb, .prow, .rcard');
      if (!el) return;
      const r = el.getBoundingClientRect();
      el.style.setProperty('--mx', (ev.clientX - r.left) + 'px');
      el.style.setProperty('--my', (ev.clientY - r.top) + 'px');
    });
  }, { passive: true });
}

/* ---------- Testy ---------- */
/* skladba testu jako staré testy z e-klubu: 35 otázek, převážně koncepční, pár krátkých výpočtů.
   Ze 29 koncepčních je aspoň T_ZK na úrovni zkoušky ('z'); každá přednáška má 2–4 otázky. */
function buildTest(i, seed) {
  const r = rng(seed ?? (i * 104729 + 17)), qs = [], used = new Set();
  const pools = THEORY.map(t => ({ z: r.shuffle(QB.map((q, k) => k).filter(k => QB[k][0] === t.n && QB[k][5] === 'z')), b: r.shuffle(QB.map((q, k) => k).filter(k => QB[k][0] === t.n && QB[k][5] !== 'z')) }));
  const take = (l, zk) => { const p = pools[l]; const k = (zk ? p.z.shift() : p.b.shift()) ?? p.z.shift() ?? p.b.shift(); if (k != null && !used.has(k)) { used.add(k); qs.push({ qb: k }); return true; } return false; };
  let zk = 0, li = r.int(0, 9);
  for (let l = 0; l < 10; l++) { take(l, true); take(l, true); zk += 2; }
  while (qs.length < T_CONCEPT) { const l = li++ % 10; if (take(l, zk < T_ZK)) zk++; }
  for (const id of r.shuffle(FAM_IDS).slice(0, T_NUM)) qs.push({ mc: problemAsMC(makeProblem(id, (seed ?? i) * 31 + id.charCodeAt(0)), r) });
  return r.shuffle(qs).map(x => x.qb != null ? { l: QB[x.qb][0], q: QB[x.qb][1], o: QB[x.qb][2], a: QB[x.qb][3], why: QB[x.qb][4], z: QB[x.qb][5] === 'z', qb: x.qb } : { ...x.mc, z: true });
}

    + (cnt ? band('', `<div class="stats"><div class="stat"><b>${cnt}</b><span>hotových testů</span></div><div class="stat"><b>${Math.round(sum / cnt)} %</b><span>průměrná úspěšnost</span></div><div class="stat"><b>${best} %</b><span>nejlepší výsledek</span></div></div>`) : '')

<div class="chips"><button class="chip" data-gl="0"${!state.gl ? ' aria-pressed="true"' : ''}>Vše</button>${THEORY.map(t => `<button class="chip" data-gl="${t.n}"${state.gl === t.n ? ' aria-pressed="true"' : ''}>${t.n}. ${t.short}</button>`).join('')}</div>
<label class="toggle"><input type="checkbox" id="glNew"${state.glOnlyNew ? ' checked' : ''}> Jen pojmy, které ještě neumím</label>`, 'center')
    + band('alt', g ? `<button class="flash" data-flip aria-label="Otočit kartičku"><span class="muted small">${state.card + 1} / ${set.length} · přednáška ${g[0]} · ${state.flip ? 'odpověď' : 'klikni nebo mezerník pro otočení'}</span>${state.flip ? `<span class="fw">${g[1]}</span><span class="fe">${esc(g[2])}</span><span class="fd">${esc(g[3])}</span>` : `<span class="fw">${state.glDir ? esc(g[2]) : g[1]}</span><span class="muted">${state.glDir ? 'Jak se to řekne česky a co to znamená?' : 'Jak se to řekne anglicky a co to znamená?'}</span>`}</button>
<div class="qnav"><button class="pill ghost" data-card="-1">← Předchozí</button><div class="chips"><button class="chip" data-know="0">Ještě ne</button><button class="chip" data-know="1"${gk[set[state.card]] ? ' aria-pressed="true"' : ''}>✓ Umím</button><button class="chip" data-gldir>${state.glDir ? 'EN → CZ' : 'CZ → EN'}</button></div><button class="pill" data-card="1">Další →</button></div>` : '<p class="lead">Všechny pojmy v tomto výběru umíš.</p>', 'narrow')
    + band('', `<h2 class="h2">Slovníček</h2><input type="search" class="search" id="glq" placeholder="Hledat pojem česky nebo anglicky" aria-label="Hledat pojem" value="${esc(state.glq || '')}"><div class="glist">${list.map(([x, i]) => `<div class="gi"><b>${x[1]}${gk[i] ? ' ✓' : ''}</b><i>${esc(x[2])}</i><span>${esc(x[3])}</span></div>`).join('') || '<p class="muted">Nic nenalezeno.</p>'}</div>`);
}

/* ---------- Termíny ---------- */
function viewTerms() {
  return band('', `<span class="eyebrow">Termíny a podmínky</span><h1 class="h1">Jeden test rozhoduje.</h1><p class="lead">Závěrečný kumulativní test tvoří 100 % hodnocení. Bonus až 10 % za aktivitu na seminářích a kvízy v Moodle.</p>`, 'center')
    + band('alt', `<div class="tbl"><table><thead><tr><th>Termín</th><th>Datum</th><th>Čas</th><th>Místo</th></tr></thead><tbody>${EVENTS.map(e => `<tr${daysTo(e.d) < 0 ? ' class="past"' : ''}><td><b>${e.what}</b></td><td>${fmtD(e.d)}</td><td>${e.t}</td><td>${e.where}</td></tr>`).join('')}</tbody></table></div>
<div class="note"><b>Co platí</b><ul><li>Test je kumulativní: přednášky 1–10.</li><li>Bonusové body: aktivita na semináři a kvízy v Moodle (zveřejněny ve středu, odevzdání do následujícího pondělí do půlnoci).</li><li>Semináře jen prezenčně: středa 12:30 (aula 314) a 14:00 (aula 206).</li><li>Literatura: Mankiw, <i>Zásady ekonomie</i>; Samuelson, Nordhaus, <i>Ekonomie</i>.</li></ul></div>
<p class="muted small">Podle úvodního semináře (30. 9. 2026), zkontrolováno ${CHECKED}. Rozhodující jsou údaje v SIS a Moodle; přihlašování na termín probíhá v SIS.</p>`, 'narrow');
}

/* ---------- vykreslení ---------- */
function render() {
  const v = state.view; let html, m;
  if (v === 'domu') html = viewHome();
  else if (v === 'teorie') html = viewTheoryIndex();
  else if ((m = v.match(/^teorie-l(\d+)$/)) && THEORY[m[1] - 1]) html = viewTheory(+m[1]);
  else if (v === 'tahak') html = viewCheat();
  else if (v === 'kviz') html = viewQuizIndex();
  else if ((m = v.match(/^kviz-(vse|chyby|zk|\d+)$/)) && (isNaN(m[1]) || THEORY[m[1] - 1])) html = viewQuiz(m[1]);
  else if (v === 'priklady') html = viewProblemsIndex();
  else if ((m = v.match(/^priklady-([A-Z]\d)$/)) && FAM[m[1]]) html = viewProblems(m[1]);
  else if (v === 'testy') html = viewTests();
  else if ((m = v.match(TEST_RE)) && +m[1] >= 1 && +m[1] <= N_TESTS) html = viewTest(+m[1]);
  else if (v === 'nahodny') html = viewTest(0, state.rndSeed ?? (state.rndSeed = Math.floor(Math.random() * 1e9)));
  else if (v === 'karticky') html = viewCards();
  else if (v === 'terminy') html = viewTerms();
  else { state.view = 'domu'; html = viewHome(); }
  $view.innerHTML = html;
  renderNav();
  const nv = NAV.find(n => n.id === navCur(state.view)), tm = state.view.match(/^teorie-l(\d+)$/), tt = tm ? THEORY[tm[1] - 1].title : state.view === 'tahak' ? 'Tahák' : nv?.l;
  document.title = state.view === 'domu' ? 'EKONOMIE I' : `${tt} · EKONOMIE I`;
  initFigs($view); typesetAll(); initToc();
  if (state.test && !state.test.done && (TEST_RE.test(state.view) || state.view === 'nahodny')) startClock();
  if (state.fxAnim && typeof fxReveal === 'function') fxReveal($view);
  state.fxAnim = false;
}
let tocObs = null;
function initToc() {
  if (tocObs) { tocObs.disconnect(); tocObs = null; }
  const toc = document.querySelector('.ltoc'); if (!toc || !('IntersectionObserver' in window)) return;
  const links = [...toc.querySelectorAll('a[data-jump]')], vis = new Map();
  tocObs = new IntersectionObserver(es => { es.forEach(e => vis.set(e.target.id, e.isIntersecting ? e.boundingClientRect.top : null));
    const on = [...vis.entries()].filter(([, v]) => v != null).sort((a, b) => a[1] - b[1])[0]; if (on) links.forEach(a => a.classList.toggle('on', a.dataset.jump === on[0])); }, { rootMargin: '-80px 0px -55% 0px' });
  links.forEach(a => { const el = document.getElementById(a.dataset.jump); if (el) tocObs.observe(el); });
}
function rerender() { const y = scrollY; render(); scrollTo({ top: y }); }
function typeset(el) {
  if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetClear && MathJax.typesetClear([el]); return MathJax.typesetPromise([el]).catch(() => { }); }
  return Promise.resolve();
}
function typesetAll() { typeset($view); }

/* ---------- události ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#menuBtn')) { setMobileMenu(!document.querySelector('.gnav').classList.contains('menu-open')); return; }
  const dd = t.closest('[data-dd]');
  if (dd) { const nv = dd.closest('.nv'), open = !nv.classList.contains('open'); closeMenus(nv); nv.classList.toggle('open', open); dd.setAttribute('aria-expanded', open); return; }
  if (!t.closest('.nv')) closeMenus();
  const jp = t.closest('[data-jump]'); if (jp) { const el = document.getElementById(jp.dataset.jump); if (el) { el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth' }); } return; }
  const g = t.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const ex = t.closest('[data-exam]'); if (ex) { store.set('examDate', ex.dataset.exam); rerender(); toast('Termín uložen v tomto prohlížeči.'); return; }
  const op = t.closest('[data-opt]');
  if (op) {
    const k = +op.closest('[data-qi]').dataset.qi, j = +op.dataset.opt;
    if (op.closest('[data-chk-q]')) { const c = state.lchk; if (c && c.pick[k] == null) { c.pick[k] = j; const qs = qStat(); qs[k] = j === QB[k][3] ? 1 : 0; store.set('qs', qs); rerender(); } return; }
    if (/^kviz-/.test(state.view)) { quizPick(j); return; }
    const T = state.test; if (T && !T.done) { T.ans[k] = j; rerender(); }
    return;
  }
  const qmv = t.closest('[data-qmove]'); if (qmv && state.qz) { quizMove(+qmv.dataset.qmove); return; }
  const qj = t.closest('[data-qj]'); if (qj && state.qz) { state.qz.i = +qj.dataset.qj; rerender(); return; }
  if (t.closest('[data-qend]') && state.qz) { state.qz.done = true; rerender(); scrollTo({ top: 0 }); return; }
  if (t.closest('[data-qresume]') && state.qz) { const z = state.qz, j = qzNextOpen(z, -1); z.done = false; if (j >= 0) z.i = j; rerender(); return; }
  if (t.closest('[data-qdk]')) { const z = state.qz; if (z && z.picks[z.i] == null) { const qi = z.set[z.i]; z.picks[z.i] = -1; const qs = qStat(); qs[qi] = 0; store.set('qs', qs); rerender(); } return; }
  const tq = t.closest('[data-tq]'); if (tq && state.test && !state.test.done) { state.test.cur = +tq.dataset.tq; rerender(); return; }
  const tm = t.closest('[data-tmove]'); if (tm && state.test) { const T = state.test; T.cur = Math.max(0, Math.min(T.qs.length - 1, T.cur + +tm.dataset.tmove)); rerender(); return; }
  if (t.closest('[data-tflag]') && state.test) { const T = state.test; T.flag[T.cur] = !T.flag[T.cur]; rerender(); return; }
  if (t.closest('[data-tclear]') && state.test) { delete state.test.ans[state.test.cur]; rerender(); return; }
  const tf = t.closest('[data-tf]'); if (tf && state.test) { state.test.filt = tf.dataset.tf; rerender(); return; }
  const rdb = t.closest('[data-read]'); if (rdb) { const rd = readMap(), n = +rdb.dataset.read; rd[n] = !rd[n]; store.set('rd', rd); toast(rd[n] ? `Přednáška ${n} označena jako prostudovaná.` : 'Označení zrušeno.'); rerender(); return; }
  if (t.closest('[data-newchk]')) { state.lchkSeed = (state.lchkSeed || 0) + 1; state.lchk = null; rerender(); return; }
  if (t.closest('[data-qagain]')) { startQuiz(state.qz.key); rerender(); return; }
  if (t.closest('[data-tend]')) { endTest(); return; }
  if (t.closest('[data-rnd]')) { state.rndSeed = Math.floor(Math.random() * 1e9); state.test = null; if (state.view === 'nahodny') { render(); scrollTo({ top: 0 }); } else go('nahodny'); return; }
  if (t.closest('[data-chk]')) { checkNum(t.closest('[data-chk]')); return; }
  if (t.closest('[data-more]')) { state.pb++; store.set('pb', state.pb); render(); scrollTo({ top: 0 }); return; }
  const gl = t.closest('[data-gl]'); if (gl) { state.gl = +gl.dataset.gl; store.set('gl', state.gl); state.card = 0; state.flip = false; if (state.view !== 'karticky') go('karticky'); else rerender(); return; }
  if (t.closest('[data-flip]')) { state.flip = !state.flip; rerender(); return; }
  const cd = t.closest('[data-card]'); if (cd) { const n = glSet().length; state.card = (state.card + +cd.dataset.card + n) % n; state.flip = false; rerender(); return; }
  const kn = t.closest('[data-know]'); if (kn) { const s = glSet(), gk = glKnown(); gk[s[state.card]] = kn.dataset.know === '1'; store.set('gk', gk); if (!state.glOnlyNew) state.card = (state.card + 1) % s.length; state.flip = false; rerender(); return; }
  if (t.closest('[data-gldir]')) { state.glDir = !state.glDir; state.flip = false; rerender(); return; }
});
document.addEventListener('change', e => { if (e.target.id === 'glNew') { state.glOnlyNew = e.target.checked; state.card = 0; state.flip = false; rerender(); } });
document.addEventListener('input', e => { if (e.target.id === 'glq') { state.glq = e.target.value; const pos = e.target.selectionStart; rerender(); const el = document.getElementById('glq'); el.focus(); el.setSelectionRange(pos, pos); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { setMobileMenu(false); closeMenus(); return; }
  if (e.target.matches('input, textarea')) { if (e.key === 'Enter' && e.target.closest('.numin')) checkNum(e.target.closest('.numin').querySelector('[data-chk]')); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const T = state.test;
  if (T && !T.done && (TEST_RE.test(state.view) || state.view === 'nahodny')) {
    const k = 'abcde'.indexOf(e.key.toLowerCase()); if (k >= 0 && k < T.qs[T.cur].o.length) { T.ans[T.cur] = k; rerender(); return; }
    if (e.key === 'ArrowRight' || e.key === 'Enter') { if (T.cur + 1 < T.qs.length) { T.cur++; rerender(); } return; }
    if (e.key === 'ArrowLeft') { if (T.cur) { T.cur--; rerender(); } return; }
    if (e.key.toLowerCase() === 'f') { T.flag[T.cur] = !T.flag[T.cur]; rerender(); return; }
  }
  if (/^kviz-/.test(state.view) && state.qz) {
    const z = state.qz; if (z.done) return;
    const k = 'abcde'.indexOf(e.key.toLowerCase()); if (k >= 0 && k < QB[z.set[z.i]][2].length && z.picks[z.i] == null) { quizPick(k); return; }
    if (e.key === 'ArrowRight' || e.key.toLowerCase() === 's' || (e.key === 'Enter' && z.picks[z.i] != null)) { quizMove(1); return; }
    if (e.key === 'ArrowLeft') { quizMove(-1); return; }
  }
  if (state.view === 'karticky') { if (e.key === ' ') { e.preventDefault(); state.flip = !state.flip; rerender(); } else if (e.key === 'ArrowRight') document.querySelector('[data-card="1"]')?.click(); else if (e.key === 'ArrowLeft') document.querySelector('[data-card="-1"]')?.click(); }
});

/* ---------- motiv ---------- */
const THEMES = ['system', 'light', 'dark'];
const ICON = {
  system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>'
};
const THEME_LABEL = { system: 'Motiv podle systému', light: 'Světlý motiv', dark: 'Tmavý motiv' };
function applyTheme(t) { if (t === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; const b = document.getElementById('themeBtn'); b.innerHTML = ICON[t]; b.title = b.ariaLabel = THEME_LABEL[t]; }
let theme = store.get('theme', 'system'); applyTheme(theme);
document.getElementById('themeBtn').addEventListener('click', () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; store.set('theme', theme); applyTheme(theme); });

const h0 = (location.hash || '').slice(1);
go(h0 && /^[a-z0-9-]+$/i.test(h0) ? h0 : 'domu', false);

</script>
