  const t = e.target;
  if (t.closest('#menuBtn')) { setMobileMenu(!document.querySelector('.gnav').classList.contains('menu-open')); return; }
  const dd = t.closest('[data-dd]');
  if (dd) { const nv = dd.closest('.nv'), open = !nv.classList.contains('open'); closeMenus(nv); nv.classList.toggle('open', open); dd.setAttribute('aria-expanded', open); return; }
  if (!t.closest('.nv')) closeMenus();
  const jp = t.closest('[data-jump]'); if (jp) { const el = document.getElementById(jp.dataset.jump); if (el) { el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth' }); } return; }
  const g = t.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const ex = t.closest('[data-exam]'); if (ex) { store.set('examDate', ex.dataset.exam); rerender(); toast('Termín uložen v tomto prohlížeči.'); return; }
  const op = t.closest('[data-opt]');
  if (op) {
    const k = +op.closest('[data-qi]').dataset.qi, j = +op.dataset.opt;
    if (/^kviz-/.test(state.view)) { quizPick(j); return; }
    const T = state.test; if (T && !T.done) { T.ans[k] = j; op.closest('.opts').querySelectorAll('.opt').forEach((b, bj) => b.setAttribute('aria-pressed', bj === j)); const p = document.getElementById('tprog'); if (p) p.textContent = `zodpovězeno ${Object.keys(T.ans).length} z ${T.qs.length}`; }
    return;
  }
  if (t.closest('[data-qnext]')) { const z = state.qz; z.i++; z.pick = null; rerender(); scrollTo({ top: 0 }); return; }
  if (t.closest('[data-qagain]')) { startQuiz(state.qz.key); rerender(); return; }
  if (t.closest('[data-tend]')) { endTest(); return; }
  if (t.closest('[data-rnd]')) { state.rndSeed = Math.floor(Math.random() * 1e9); state.test = null; if (state.view === 'nahodny') { render(); scrollTo({ top: 0 }); } else go('nahodny'); return; }
  if (t.closest('[data-chk]')) { checkNum(t.closest('[data-chk]')); return; }
  if (t.closest('[data-more]')) { state.pb++; store.set('pb', state.pb); render(); scrollTo({ top: 0 }); return; }
  const gl = t.closest('[data-gl]'); if (gl) { state.gl = +gl.dataset.gl; store.set('gl', state.gl); state.card = 0; state.flip = false; if (state.view !== 'karticky') go('karticky'); else rerender(); return; }
  if (t.closest('[data-flip]')) { state.flip = !state.flip; rerender(); return; }
  const cd = t.closest('[data-card]'); if (cd) { const n = glSet().length; state.card = (state.card + +cd.dataset.card + n) % n; state.flip = false; rerender(); return; }
  const kn = t.closest('[data-know]'); if (kn) { const s = glSet(), gk = glKnown(); gk[s[state.card]] = kn.dataset.know === '1'; store.set('gk', gk); if (!state.glOnlyNew) state.card = (state.card + 1) % s.length; state.flip = false; rerender(); return; }
  if (t.closest('[data-gldir]')) { state.glDir = !state.glDir; state.flip = false; rerender(); return; }
});
document.addEventListener('change', e => { if (e.target.id === 'glNew') { state.glOnlyNew = e.target.checked; state.card = 0; state.flip = false; rerender(); } });
document.addEventListener('input', e => { if (e.target.id === 'glq') { state.glq = e.target.value; const pos = e.target.selectionStart; rerender(); const el = document.getElementById('glq'); el.focus(); el.setSelectionRange(pos, pos); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { setMobileMenu(false); closeMenus(); return; }
  if (e.target.matches('input, textarea')) { if (e.key === 'Enter' && e.target.closest('.numin')) checkNum(e.target.closest('.numin').querySelector('[data-chk]')); return; }
  if (/^kviz-/.test(state.view) && state.qz) {
    const k = 'abcde'.indexOf(e.key.toLowerCase()); if (k >= 0 && state.qz.pick == null) { quizPick(k); return; }
    if (e.key === 'Enter' && state.qz.pick != null) { document.querySelector('[data-qnext]')?.click(); }
  }
  if (state.view === 'karticky') { if (e.key === ' ') { e.preventDefault(); state.flip = !state.flip; rerender(); } else if (e.key === 'ArrowRight') document.querySelector('[data-card="1"]')?.click(); else if (e.key === 'ArrowLeft') document.querySelector('[data-card="-1"]')?.click(); }
});

/* ---------- motiv ---------- */
const THEMES = ['system', 'light', 'dark'];
const ICON = {
  system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>'
};
const THEME_LABEL = { system: 'Motiv podle systému', light: 'Světlý motiv', dark: 'Tmavý motiv' };
function applyTheme(t) { if (t === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; const b = document.getElementById('themeBtn'); b.innerHTML = ICON[t]; b.title = b.ariaLabel = THEME_LABEL[t]; }
let theme = store.get('theme', 'system'); applyTheme(theme);
document.getElementById('themeBtn').addEventListener('click', () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; store.set('theme', theme); applyTheme(theme); });

const h0 = (location.hash || '').slice(1);
go(h0 && /^[a-z0-9-]+$/i.test(h0) ? h0 : 'domu', false);

</script>
