${idea('Model je zjednodušená mapa reality. Nemá být dokonalý, má pomoct pochopit jeden mechanismus.')}
<p><b>Mikroekonomie</b> studuje rozhodování domácností a firem a jejich interakce na trzích. <b>Makroekonomie</b> studuje ekonomiku jako celek: inflaci, nezaměstnanost, růst. Ekonomie postupuje jako věda: teorie a pozorování, předpoklady, modely.</p>
${def('Pozitivní výrok', 'popisuje svět, jaký <i>je</i>; lze ho ověřit daty. <b>Normativní výrok</b> říká, jaký by svět <i>měl být</i> (poznáš ho podle „měl by“, „je spravedlivé“).')}`),
  S('Model 1: ekonomický koloběh', R`
${idea('Peníze a věci se v ekonomice točí v kruhu: co ty utratíš, je něčí příjem, a co firma zaplatí za práci, je tvoje mzda.')}
<p>Firmy a domácnosti se potkávají na dvou trzích. Na <b>trhu zboží a služeb</b> firmy prodávají a domácnosti kupují. Na <b>trhu výrobních faktorů</b> domácnosti prodávají práci, půdu a kapitál a dostávají mzdu, rentu a zisk. Tok statků a faktorů jde jedním směrem, tok peněz opačným. <b>Smíšená ekonomika</b> přidává stát: vybírá daně, platí transfery a poskytuje veřejné statky. Model zachycuje statickou rovnováhu; realita je složitější.</p>
${tbl(['Autor', 'Myšlenka'], [['A. Smith (1776), <i>Bohatství národů</i>', 'Kdo sleduje vlastní prospěch, je „neviditelnou rukou“ veden k prospěchu společnosti.'], ['J. M. Keynes (1936)', 'Vládní výdaje zvýší agregátní poptávku a zabrání propadu a nezaměstnanosti.'], ['J. Schumpeter (1942)', 'Motorem kapitalismu je dočasný monopol inovátora; kopírování a <i>kreativní destrukce</i>.']])}
${fig('circ', 'Ekonomický koloběh. Modré tečky jsou statky a výrobní faktory, zelené peníze. Přepni na smíšenou ekonomiku se státem.')}`),
  S('Model 2: hranice produkčních možností (PPF)', R`
${idea('PPF je čára „víc už se s tím, co máme, vyrobit nedá“. Chceš víc jednoho? Musíš ubrat z druhého.')}
${def('Hranice produkčních možností', 'jsou všechny kombinace výroby dvou statků, kdy víc jednoho lze získat jen za cenu méně druhého (při daných zdrojích a technologii).')}
${fig('ppf', 'Body na křivce jsou efektivní, uvnitř neefektivní, vně nedosažitelné. Posuvníky mění zdroje a technologii.')}
<p>Model PPF umožňuje: definovat efektivní výrobu, rozlišit pohyb po křivce a pohyb křivky, pochopit náklady příležitosti, popsat rostoucí a klesající výnosy a vyhnout se zjednodušenému porovnávání ekonomik.</p>
${tbl(['Co se děje', 'Na PPF', 'Příklad'], [['realokace zdrojů', '<b>pohyb po křivce</b> (E₁ → E₂)', 'změna preferencí, víc investic a méně spotřeby'], ['ekonomická expanze', '<b>posun křivky ven</b> (E₁ → E₃)', 'víc zdrojů, lepší technologie'], ['pokrok jen ve výrobě X', 'pootočení kolem průsečíku s osou Y', 'nový stroj na auta'], ['nevyužité zdroje', 'bod uvnitř', 'nezaměstnanost']])}`),
  S('PPF a náklady příležitosti', R`
${idea('Náklad příležitosti je to, čeho se vzdáš. Na PPF ho vidíš jako sklon: o kolik spadne jeden statek, když přidáš druhý.')}
${rule('Pravidlo', R`<p>Náklad příležitosti jednotky statku na vodorovné ose = o kolik klesne statek na svislé ose: \(\text{OC}_X = \dfrac{\Delta Y}{\Delta X}\). Graficky je to <b>sklon</b> PPF.</p>
${fig('ppfshape', 'Králíci a bobule ze slidů: tři tvary PPF a tři typy nákladů příležitosti. Posuvník přidává králíky po jednom.')}`)}
${tbl(['Tvar PPF', 'Náklady příležitosti', 'Proč'], [['konkávní (vypouklá ven)', '<b>rostoucí</b>', 'zdroje nejsou stejně vhodné pro oba statky; zákon klesajících výnosů (nejdřív nejúrodnější půda, pak podhůří, nakonec hory)'], ['přímka', '<b>konstantní</b>', 'zdroje jsou pro oba statky stejně dobré'], ['konvexní (prohnutá k počátku)', '<b>klesající</b>', 'rostoucí výnosy ve výrobě (úspory z rozsahu)']])}
${ex('Králíci a bobule (slidy)', R`${tbl(['Bod', 'Králíci', 'Bobule', 'OC dalšího králíka'], [['A', '0', '300', '—'], ['B', '1', '280', '20'], ['C', '2', '240', '40'], ['D', '3', '180', '60'], ['E', '4', '100', '80'], ['F', '5', '0', '100']])}<p>Náklady příležitosti rostou (20, 40, 60, …) ⇒ PPF je konkávní. Kdyby bobule klesaly o 60 v každém kroku, šlo by o přímku (konstantní OC); kdyby klesaly o 100, 80, 60, 40, 20, PPF by byla konvexní (klesající OC).</p>`)}`),
  S('Porovnání ekonomik a investice', R`
<ul><li>Země A s výkonnější PPF může mít nižší spotřebu než země B: rozhoduje, kterou kombinaci zvolí.</li><li>Z růstu soukromé spotřeby v čase neplyne, že ekonomika expanduje: mohla se jen přesunout po PPF (méně veřejných statků).</li><li>Země, která dnes investuje (vyrábí kapitálové statky na úkor spotřeby), bude mít zítra PPF dál od počátku.</li></ul>`),
  S('Komparativní výhoda a směna', R`
${idea('Obchod se vyplatí, i když jeden umí všechno lépe. Rozhoduje, komu daná věc „stojí“ méně ušlých příležitostí.')}
${def('Absolutní výhoda', 'má ten, kdo statek vyrobí s menším množstvím vstupů (vyšší produktivita, nižší náklady).')}
${def('Komparativní výhoda', 'má ten, kdo statek vyrobí s <i>nižšími náklady příležitosti</i>. Lze mít absolutní výhodu ve všem, ale komparativní výhodu vždy jen v něčem (D. Ricardo, 1817).')}
${rule('Postup', R`<ol><li>Spočítej každému náklad příležitosti obou statků (z maximálních výstupů, lineární PPF).</li><li>Komparativní výhodu má ten s nižším OC; každý se specializuje na „svůj“ statek.</li><li>Směnný poměr musí ležet <b>mezi</b> náklady příležitosti obou stran, jinak se jednomu směna nevyplatí.</li></ol>
${fig('trade', 'Červený a Modrý: bez obchodu, pak se specializací. Měň cenu stolu a sleduj, kdy se směna vyplatí oběma.')}`)}
${ex('Červený a Modrý: židle a stoly', R`<p>Červený vyrobí za den 30 židlí, nebo 10 stolů. Modrý 10 židlí, nebo 30 stolů.</p>${tbl(['', 'OC 1 židle', 'OC 1 stolu'], [['Červený', '1/3 stolu', '3 židle'], ['Modrý', '3 stoly', '1/3 židle']])}<p>Červený má komparativní (i absolutní) výhodu v židlích, Modrý ve stolech. Cena 1 stolu musí být mezi \(\tfrac13\) a 3 židlemi: Modrý stůl prodá, když dostane víc než \(\tfrac13\) židle (jeho OC), Červený ho koupí, když zaplatí méně než 3 židle (jeho OC). Např. 1 stůl = 1 židle a směna 15 za 15 posune obě strany za jejich PPF.</p>`)}
${ex('Země A a B: kalhoty a trička', R`<p>A vyrobí 20 kalhot, nebo 10 triček; B 30 kalhot, nebo 45 triček. OC kalhot: A 0,5 trička, B 1,5 trička ⇒ A má komparativní výhodu v kalhotách (přestože B má absolutní výhodu v obojím). OC trička: A 2 kalhoty, B 0,67 kalhot ⇒ B vyrábí trička. Cena kalhot musí být v intervalu ⟨0,5 T; 1,5 T⟩.</p>`)}`),
  S('Léčky ekonomického uvažování', R`
<ol><li>vědecká předpojatost,</li><li>nedodržení <i>ceteris paribus</i> (za jinak stejných podmínek),</li><li>trend ≠ zákon,</li><li>omyl skladby: co platí pro část, platí pro celek,</li><li><i>post hoc ergo propter hoc</i>: „poté, tedy proto“,</li><li>opomenuté proměnné,</li><li>záměna příčiny a následku.</li></ol>
<p><b>Korelace není kauzalita:</b> výdaje USA na vědu a počet sebevražd oběšením spolu v letech 1999–2009 korelují na 99,8 %, a přesto spolu nesouvisí.</p>
${pit(['Bod uvnitř PPF = neefektivita, ne nedosažitelnost.', 'Konkávní PPF ⇒ rostoucí OC; konvexní ⇒ klesající.', 'Komparativní výhoda se určuje z OC, ne z produktivity.', 'Výrobní faktory: práce, půda, kapitál.'])}`)] },

{ n: 3, title: 'Teorie nabídky a poptávky', short: 'Trh, elasticity',
  key: ['Změna ceny = <b>pohyb po křivce</b>; změna čehokoli jiného = <b>posun křivky</b>.', 'Rovnováha: \\(D(p^*) = S(p^*)\\); převis nabídky tlačí cenu dolů, převis poptávky nahoru.', 'Elasticita = % změna množství / % změna ceny. Elastická poptávka: zdražení sníží tržby.', 'YED: luxusní > 1, nezbytný 0–1, podřadný < 0. XED: substituty > 0, komplementy < 0.', 'Přebytek spotřebitele = ochota platit − cena; výrobce = cena − mezní náklady.'],
  secs: [
  S('Trh a jeho historie', R`
${def('Trh', 'je skupina kupujících a prodávajících určitého statku. Na <b>konkurenčním trhu</b> je jich tolik, že každý má na cenu zanedbatelný vliv.')}
${def('Vlastnické právo', 'je výlučné, vynutitelné a převoditelné panství nad věcí; bez něj trh nefunguje.')}
<p>Vývoj: 19. století <i>laissez-faire</i>; začátek 20. století korupce a chudoba, roste role vlády; během 20. století stát blahobytu; konec 20. století odklon od státu blahobytu a privatizace, plánované ekonomiky přecházejí k decentralizaci.</p>`),
  S('Poptávka', R`
${idea('Čím je něco dražší, tím méně toho lidé chtějí koupit. Poptávka je celá křivka (pro každou cenu množství), ne jedno číslo.')}
${def('Poptávka D(p)', 'je závislost poptávaného množství Q na ceně p, <i>ceteris paribus</i>. <b>Poptávané množství</b> je jeden bod této funkce.')}
${rule('Zákon poptávky', R`<p>S růstem ceny poptávané množství klesá. Důvody: <b>substituční efekt</b> (lidé přejdou k substitutům) a <b>důchodový efekt</b> (klesne reálný důchod). Výjimky: <b>Giffenův statek</b>, <b>Veblenův statek</b> (okázalá spotřeba).</p><p>Poptávka je obvykle klesající a <b>konvexní</b>: změna ceny o jednotku má větší vliv při nízké ceně, protože osloví víc spotřebitelů.</p>
${fig('mktsum', 'Tržní poptávka vznikne sečtením množství všech kupujících při každé ceně (vodorovný součet).')}`)}
${tbl(['Co se změní', 'Co se stane s poptávkou'], [['cena statku', '<b>pohyb po křivce</b> (změna poptávaného množství)'], ['důchod ↑', '<b>normální</b> statek: posun doprava; <b>podřadný</b>: posun doleva'], ['cena substitutu ↑', 'posun doprava'], ['cena komplementu ↑', 'posun doleva'], ['počet kupujících, chutě, očekávání', 'posun křivky']])}
${ex('Tržní poptávka jako součet (slidy)', R`<p>Tržní poptávka je <b>vodorovný součet</b> individuálních: při každé ceně sečteme množství. Při p = 1 chce spotřebitel 1 koupit 2 kusy a spotřebitel 2 osm kusů, trh tedy 10. Při p = 3: 1 + 5 = 6; při p = 5: 0 + 2 = 2; při p = 7 nikdo nic.</p>`)}`),
  S('Nabídka', R`
${idea('Čím vyšší cena, tím víc se vyplatí vyrábět, a tím víc výrobců se „vejde do ceny“.')}
${def('Nabídka S(p)', 'je závislost nabízeného množství na ceně, <i>ceteris paribus</i>. Tržní nabídka je součet individuálních.')}
${rule('Zákon nabídky', R`<p>S růstem ceny nabízené množství roste: do ceny se „vejde“ víc výrobců a výrobci přesouvají výrobu k výnosnějším komoditám. Pod \(p_{min}\) se nevyplatí vyrábět; nad technologickým maximem \(q_{max}\) to nejde. Výjimka: <b>nabídka práce</b> (od určité mzdy lidé chtějí víc volna).</p>`)}
<p>Posun nabídky způsobí: <b>ceny vstupů</b>, technologie, počet výrobců, vládní zásahy (daně, dotace), očekávané zisky.</p>`),
  S('Rovnováha', R`
${idea('Cena se hýbe, dokud kupující nechtějí přesně tolik, kolik prodávající nabízejí. Tak trh „najde“ cenu sám.')}
${fig('sd', 'Posuň poptávku nebo nabídku a sleduj, co se stane s rovnovážnou cenou a množstvím.')}
${rule('Zákon nabídky a poptávky', R`<p>Při \(p > p^*\) je \(S > D\): <b>převis nabídky</b>, výrobci se podbízejí, cena klesá. Při \(p \lt p^*\) je \(D > S\): <b>převis poptávky</b>, cena roste. V rovnováze \(D(p^*) = S(p^*)\).</p><p>Lineárně: \(Q_D = a - bp\), \(Q_S = c + dp\) ⇒ \(p^* = \dfrac{a-c}{b+d}\), \(q^* = a - b p^*\).</p>
${fig('excess', 'Mimo rovnováhu: při vysoké ceně zbývá zboží, při nízké chybí. Obojí tlačí cenu k p*.')}`)}
${tbl(['Změna', 'Cena', 'Množství'], [['poptávka ↑', '↑', '↑'], ['poptávka ↓', '↓', '↓'], ['nabídka ↑', '↓', '↑'], ['nabídka ↓', '↑', '↓'], ['poptávka ↑ a nabídka ↑', '?', '↑'], ['poptávka ↑ a nabídka ↓', '↑', '?']])}`),
  S('Cenová elasticita poptávky', R`
${idea('Elasticita měří citlivost: když cena vzroste o 1 %, o kolik % klesne prodané množství? Na tom závisí, jestli zdražení firmě tržby zvýší, nebo sníží.')}
${rule('Vzorec', R`\[\varepsilon_D = \frac{\%\Delta Q}{\%\Delta p} = \frac{\Delta Q / Q}{\Delta p / p} = \frac{\Delta Q}{\Delta p}\cdot\frac{p}{Q}\]<p>Na přednášce se počítá procentní změna <b>z výchozího bodu</b> (z A do B). Na semináři se používá i <b>středová metoda</b> (průměr obou bodů ve jmenovateli), která dá stejný výsledek oběma směry. Čím menší \(\Delta p\), tím přesnější; přesně derivací.</p>
${fig('etypes', 'Pět typů poptávky. Změň cenu z 2 na jinou a sleduj, co se stane s tržbami.')}`)}
${tbl(['|ε|', 'Poptávka', 'Cena ↑ ⇒ tržby'], [['0', 'dokonale neelastická (svislá)', '↑'], ['(0, 1)', 'neelastická', '↑'], ['1', 'jednotková, např. \\(Q = k/p\\)', 'beze změny'], ['(1, ∞)', 'elastická', '↓'], ['∞', 'dokonale elastická (vodorovná)', 'nic neprodá']])}
${fig('elast', 'Na lineární poptávce se elasticita mění: nahoře elastická, uprostřed jednotková, dole neelastická. Tržby (obdélník) jsou největší při |ε| = 1.')}
${ex('Elasticita a tržby z tabulky (slidy)', R`${tbl(['Bod', 'Cena', 'Q', 'Tržby p·Q'], [['A', '9', '2', '18'], ['B', '8', '4', '32'], ['C', '5,5', '9', '49,5'], ['D', '4,5', '11', '49,5'], ['E', '2', '16', '32'], ['F', '1', '18', '18']])}<p>Z A do B: \(\varepsilon = \dfrac{(4-2)/2}{(8-9)/9} = -9\) ⇒ elastická, zlevnění zvýší tržby. Z E do F: \(\varepsilon = \dfrac{(18-16)/16}{(1-2)/2} = -0{,}25\) ⇒ neelastická, zlevnění tržby sníží. Maximum tržeb je mezi C a D.</p>`)}
${rule('Na čem PED závisí', R`<p>Vyšší elasticita: blízké <b>substituty</b>, úzce vymezený trh, <b>dlouhé</b> období, luxusní (zbytný) statek, velký podíl na důchodu. Nízká: nezbytnosti, krátké období, levné zboží. Znaménko: běžný statek \(\varepsilon \lt 0\), Giffenův \(\varepsilon > 0\).</p>`)}`),
  S('Další elasticity', R`
${tbl(['Elasticita', 'Vzorec', 'Výklad'], [['důchodová (YED)', '\\(\\%\\Delta Q / \\%\\Delta Y\\)', '> 1 luxusní; (0, 1) nezbytný; obojí normální; < 0 podřadný (inferiorní)'], ['křížová (XED)', '\\(\\%\\Delta Q_A / \\%\\Delta p_B\\)', '> 0 substituty; < 0 komplementy; 0 nesouvisející'], ['cenová elasticita nabídky (PES)', '\\(\\%\\Delta Q_S / \\%\\Delta p\\)', 'roste s delším horizontem a dostupností vstupů; PES = 0 je velmi krátkodobá, pevná nabídka']])}`),
  S('Efektivita trhu a přebytky', R`
${idea('Přebytek je „zisk z obchodu“. Kupující platí míň, než by byl ochoten, prodávající dostane víc, než by mu stačilo.')}
${def('Přebytek spotřebitele', 'je rozdíl mezi tím, kolik by spotřebitel byl ochoten zaplatit (výška poptávky = jeho mezní užitek), a tím, kolik skutečně zaplatí. Graficky plocha pod D a nad cenou.')}
${def('Přebytek výrobce', 'je rozdíl mezi tržní cenou a mezními náklady výrobce (výška nabídky). Plocha nad S a pod cenou.')}
<p>Konkurenční rovnováha je <b>efektivní</b>: vyrovnává mezní užitek s mezními náklady (\(MU = p = MC\)) a součet přebytků je maximální.</p>
${pit(['„Vzrostla poptávka“ (posun) ≠ „vzrostlo poptávané množství“ (pohyb kvůli ceně).', 'Strmost lineární křivky ≠ elasticita; elasticita se podél přímky mění.', 'Elasticita 0,4 a cena +1 % ⇒ množství −0,4 %.', 'Pevná částka utracená bez ohledu na cenu ⇒ |ε| = 1.'])}`)] },

{ n: 4, title: 'Nabídka, poptávka a vládní politiky', short: 'Daně, regulace',
  key: ['Daň vrazí klín mezi cenu kupujícího a prodávajícího; je jedno, komu je uložena.', 'Daň nese víc ta strana, která je <b>méně elastická</b>.', 'Ztráta mrtvé váhy = přebytek, který nezíská nikdo; nejmenší u neelastických trhů (Ramsey).', 'Strop váže jen pod rovnováhou (nedostatek), minimální cena jen nad ní (přebytek).', 'Lafferova křivka: od určité sazby vyšší daň snižuje výnos.'],
  secs: [
  S('Přebytky jako měřítko efektivity', R`
${idea('Celkový přebytek měří, kolik hodnoty trh vytvořil. Volný trh ho maximalizuje; zásahy ho většinou zmenší.')}
<p>Poptávka ukazuje mezní užitek, nabídka mezní náklady. V rovnováze je součet přebytků (A + B) maximální. Každá distorze (daň, regulace) ho zmenší.</p>
${ex('Přebytky z tabulky (slidy)', R`<p>Čtyři kupující jsou ochotni zaplatit za auto 700, 600, 500 a 400 tis. Při ceně 400 tis. se prodají 4 auta a <b>přebytek spotřebitelů</b> = (700 − 400) + (600 − 400) + (500 − 400) + 0 = 600 tis. Výrobci by čtyři auta prodali za 100, 200, 300 a 400 tis., <b>přebytek výrobců</b> = 300 + 200 + 100 + 0 = 600 tis. <b>Přebytek trhu</b> = 1 200 tis.</p>
${fig('surplus', 'Přebytky a ztráta mrtvé váhy. Posuň prodané množství mimo rovnováhu a sleduj červený trojúhelník.')}`)}`),
  S('Daň', R`
${idea('Daň zdraží věc kupujícím a zlevní ji prodávajícím. Rozdíl si vezme stát a část obchodů se vůbec neuskuteční.')}
${fig('tax', 'Nastav výši daně a elasticitu nabídky. Plochy: přebytek spotřebitele, přebytek výrobce, výnos daně a ztráta mrtvé váhy.')}
${rule('Jak daň funguje', R`<ul><li>Daň \(t\) na jednotku: kupující platí \(p_D\), prodávající dostane \(p_S\), \(p_D - p_S = t\); prodané množství klesne z \(q^*\) na \(q_t\).</li><li><b>Daň na kupující</b> posune D dolů o t, <b>daň na prodávající</b> posune S nahoru o t. Výsledek je stejný.</li><li>Přebytek spotřebitele klesne o C + E, výrobce o D + F; stát vybere C + D; <b>E + F je ztráta mrtvé váhy</b> (umrtvená ztráta).</li></ul>`)}
${rule('Výpočet (lineární D a S)', R`<p>\(Q_D = a - bp\), \(Q_S = c + dp\). Po zdanění prodávajících: \(Q_S = c + d(p - t)\). Pak \(p_D = \dfrac{a - c + dt}{b + d}\), \(p_S = p_D - t\), \(q_t = q^* - \dfrac{bd}{b+d}\,t\). Kupující nesou podíl \(\dfrac{d}{b+d}\) daně, prodávající \(\dfrac{b}{b+d}\). \(DWL = \tfrac12\,t\,(q^* - q_t)\), výnos \(= t\,q_t\).</p>`)}`),
  S('Kdo daň zaplatí', R`
<p>„Plátce pyká za svou cenovou nepružnost.“ Kdo nemůže uhnout (nemá substituty), nese větší část daně, bez ohledu na to, komu ji zákon ukládá.</p>
${tbl(['Situace', 'Kdo nese většinu', 'Příklad'], [['poptávka nepružná (PED < PES)', 'kupující: cena vzroste skoro o celou daň', 'léky na rakovinu'], ['nabídka nepružná (PED > PES)', 'prodávající: dostanou o skoro celou daň méně', 'poplatek z ubytování, rybí trh'], ['sociální pojištění', 'zaměstnanci i zaměstnavatelé podle elasticit trhu práce', '—']])}
<p><b>Dotace</b> funguje jako záporná daň: klín jde opačným směrem, kupující platí méně, prodávající dostane víc a vyrobí se <i>víc</i> než v rovnováze. I dotace vytváří ztrátu mrtvé váhy (vyrábí se kusy, jejichž MC převyšuje MU) a stát ji zaplatí z daní.</p>
${def('Ramseyovy daně', 'zdaňují statky s nejnižší elasticitou nabídky i poptávky: množství se skoro nezmění, takže ztráta efektivity je nejmenší. Jsou to ale často sociálně citlivé nezbytnosti, proto jde o politicky sporné daně.')}`),
  S('Lafferova křivka', R`
${idea('Když stát zdaní všechno na 100 %, nikdo nic nedělá a stát nevybere nic. Někde mezi 0 a 100 % je výnos nejvyšší.')}
${def('Lafferova křivka', 'ukazuje teoretický vztah mezi daňovou sazbou a daňovými příjmy státu. Při 0 % i při 100 % je výnos nulový; od určité sazby (vrchol L) příjmy s vyšší sazbou <b>klesají</b>.')}
<p>Stejný výnos lze proto vybrat dvěma různými sazbami: nízkou a vysokou. Vyšší sazba přitom způsobí větší ztrátu mrtvé váhy.</p>
${fig('laffer', 'Lafferova křivka (schematicky). Každý výnos kromě maxima lze vybrat dvěma sazbami.')}`),
  S('Cenová regulace', R`
${idea('Regulace ceny nezmění, kolik lidé chtějí a kolik se vyrobí. Jen zabrání ceně, aby trh vyrovnala.')}
${fig('ceil', 'Cenový strop pod rovnováhou vytvoří nedostatek, minimální cena nad rovnováhou přebytek.')}
${tbl(['Nástroj', 'Kdy trh váže', 'Důsledek', 'Příklad'], [['cenový strop (nejvyšší povolená cena)', '\\(p_{max} \\lt p^*\\)', 'nedostatek \\(q_D - q_S\\)', 'benzín, nájemné'], ['minimální cena (nejnižší povolená)', '\\(p_{min} > p^*\\)', 'přebytek \\(q_S - q_D\\)', 'minimální mzda ⇒ nezaměstnanost'], ['strop nad / minimum pod \\(p^*\\)', 'neváže', 'nic se nemění', '']])}
<ul><li><b>Benzín:</b> strop zprvu neváže. Zdraží-li ropa (S doleva), nová rovnovážná cena \(p^{**}\) je nad stropem; cena zůstane na \(p_{max}\) a vznikne nedostatek.</li><li><b>Nájemné:</b> krátkodobě jsou nabídka i poptávka bytů nepružné, nedostatek je malý; dlouhodobě elastičtější, nedostatek je mnohem větší.</li><li><b>Minimální mzda:</b> \(w_{min} > w^*\) ⇒ nabízené množství práce > poptávané ⇒ nezaměstnanost.</li></ul>
${fig('minwage', 'Minimální mzda jako minimální cena na trhu práce: když je nad rovnovážnou mzdou, vzniká nezaměstnanost.')}
${fig('rent', 'Regulace nájemného krátkodobě a dlouhodobě: stejný strop, ale v dlouhém období mnohem větší nedostatek.')}`),
  S('Zemědělství a dotace', R`
${idea('Paradox zemědělců: dobrá úroda je pro ně špatná zpráva, protože lidé nesnědí o moc víc a cena spadne.')}
<p>Poptávka po potravinách je nepružná a nabídka ještě nepružnější. Když zemědělci zvýší efektivitu (S doprava), cena prudce klesne a <b>tržby klesnou</b>: \(p_1 q_1 \lt p_0 q_0\).</p>
${tbl(['', 'Dotace k ceně', 'Dotace za půdu ladem'], [['tržby zemědělců', '↑', '↑'], ['cena pro spotřebitele', 'beze změny (bez inflace)', '↑ (inflační impuls)'], ['užitek spotřebitelů', 'nezmění se', '↓ (za méně zaplatí víc)'], ['dvojí ceny', 'ano (spotřebitel p₀, výrobce p₁)', 'ne, alokační efektivita nenarušena'], ['hektarové výnosy', '—', '↑']])}
${fig('agri', 'Rekordní úroda při nepružné poptávce: víc úrody, ale menší tržby.')}
${pit(['Daň zaplatí obě strany, i když je „uložena“ jen jedné.', 'Strop nad rovnovážnou cenou nic nedělá.', 'Výnos daně ≠ ztráta mrtvé váhy.', 'Dlouhodobě jsou následky regulace větší (elastičtější křivky).'])}`)] },

{ n: 5, title: 'Teorie chování spotřebitele', short: 'Spotřebitel',
  key: ['Mezní užitek klesá; optimum: \\(MU_1/p_1 = MU_2/p_2\\).', 'Indiferenční křivky klesají, jsou konvexní a neprotínají se; sklon = MRS.', 'Rozpočtová přímka: \\(Y = p_1x_1 + p_2x_2\\), sklon \\(-p_1/p_2\\).', 'Optimum v dotyku: \\(MRS = p_1/p_2\\).', 'Cenový efekt = substituční + důchodový. Giffenův statek: důchodový efekt převáží.'],
  secs: [
  S('Užitek', R`
${idea('První kousek pizzy je skvělý, pátý už tolik ne. Tomu se říká klesající mezní užitek.')}
${def('Užitek', 'je relativní uspokojení ze spotřeby. <b>Kardinální</b> užitek lze vyjádřit čísly, <b>ordinální</b> jen seřadí preference.')}
${def('Mezní užitek MU', 'je přírůstek uspokojení z jednotky navíc.')}
${rule('Zákon klesajícího mezního užitku', R`<p>S rostoucí spotřebou mezní užitek z poslední jednotky klesá. Celkový užitek roste, dokud \(MU > 0\).</p>${tbl(['Q', '0', '1', '2', '3', '4', '5', '6+'], [['TU', '0', '40', '70', '85', '95', '100', '100'], ['MU', '—', '40', '30', '15', '10', '5', '0']])}
${fig('mu', 'Celkový a mezní užitek z tabulky. Každý další kus přidá méně.')}`)}
${rule('Princip rovnosti mezních užitků', R`\[\frac{MU_1}{p_1} = \frac{MU_2}{p_2} = \dots = \frac{MU_n}{p_n}\]<p>Poslední koruna musí přinést stejný užitek u každého statku. Kdyby \(MU_1/p_1 > MU_2/p_2\), vyplatí se přesunout korunu ke statku 1.</p>`)}`),
  S('Indiferenční křivky', R`
${idea('Indiferenční křivka spojuje všechny nákupy, které by tě těšily stejně. Je ti jedno, který z nich dostaneš.')}
${def('Indiferenční křivka (izokvanta užitku)', 'spojuje spotřební koše, které dávají stejný užitek; je to řez užitkovou funkcí dvou statků.')}
<p>Vlastnosti: výše položené jsou preferovány; jsou <b>klesající</b>; <b>neprotínají se</b>; jsou <b>konvexní</b> vůči počátku.</p>
${rule('Mezní míra substituce', R`<p>Při výměně části \(x_2\) za \(x_1\) beze změny užitku: \(MU_1\,\Delta x_1 + MU_2\,\Delta x_2 = 0\), tedy</p>\[MRS_{12} = -\frac{\Delta x_2}{\Delta x_1} = \frac{MU_1}{MU_2}\]<p>= sklon indiferenční křivky; podél ní klesá (proto konvexita).</p>
${fig('ic', 'Mapa indiferenčních křivek. Posouvej bod po křivce a sleduj, jak se mění MRS (sklon).')}`)}
${tbl(['Preference', 'Tvar křivek', 'Příklad'], [['dokonalé substituty', 'přímky', 'stokoruny a tisícikoruny'], ['dokonalé komplementy', 'pravé úhly (L)', 'levá a pravá bota'], ['jeden statek nežádoucí', 'svislé / vodorovné', 'spotřebitel ho nekupuje'], ['nasycení', 'kruhy kolem bodu nasycení', 'statek žádoucí jen do určitého množství']])}`),
  S('Rozpočtové omezení', R`
${idea('Rozpočtová přímka je všechno, co si můžeš dovolit, když utratíš celý důchod.')}
\[Y = p_1 x_1 + p_2 x_2 \quad\Rightarrow\quad x_2 = \frac{Y}{p_2} - \frac{p_1}{p_2}\,x_1\]
<p>Průsečíky s osami \(Y/p_1\) a \(Y/p_2\), sklon \(-p_1/p_2\). <b>Růst důchodu</b> posune přímku rovnoběžně ven. <b>Pokles \(p_1\)</b> ji pootočí kolem průsečíku na ose \(x_2\).</p>
${fig('budget', 'Měň důchod a cenu statku 1: optimum se posouvá po důchodové (ICC) a cenové (PCC) spotřební křivce.')}`),
  S('Optimum spotřebitele', R`
${idea('Nejlepší nákup je tam, kde se rozpočtová přímka jen <i>dotkne</i> nejvyšší indiferenční křivky, kterou si můžeš dovolit.')}
${rule('Podmínka optima', R`<p>Spotřebitel maximalizuje užitek na rozpočtové přímce. V optimu je přímka tečnou nejvyšší dosažitelné indiferenční křivky:</p>\[MRS_{12} = \frac{MU_1}{MU_2} = \frac{p_1}{p_2}\]`)}
${ex('Cobb-Douglasův užitek', R`<p>Pro \(U = x_1^{a} x_2^{b}\) spotřebitel utratí za statek 1 vždy podíl \(\tfrac{a}{a+b}\) důchodu: \(x_1^* = \dfrac{a}{a+b}\cdot\dfrac{Y}{p_1}\). Při \(U = x_1x_2\), \(Y = 100\), \(p_1 = 5\), \(p_2 = 10\): \(x_1 = 10\), \(x_2 = 5\).</p>`)}
<p>Rohová řešení: nežádoucí statek se nekupuje; u dokonalých substitutů se kupuje jen relativně levnější; u komplementů pevný poměr.</p>`),
  S('Změna důchodu a ceny', R`
${idea('Když zbohatneš, některé věci kupuješ víc (normální), jiné méně (podřadné). Engelova křivka to ukazuje.')}
${def('Důchodová spotřební křivka (ICC)', 'spojuje optima při různých důchodech. Z ní plyne <b>Engelova křivka</b> (poptávka po statku podle důchodu).')}
${def('Cenová spotřební křivka (PCC)', 'spojuje optima při různých cenách jednoho statku; z ní plyne poptávková křivka. U běžného statku klesající, u Giffenova rostoucí.')}
${tbl(['Statek', 'YED', 'Engelova křivka'], [['luxusní', '> 1', 'roste rychleji než důchod'], ['nezbytný', '(0, 1)', 'roste pomaleji'], ['podřadný', '< 0', 'klesá']])}
${fig('engel', 'Engelova křivka pro tři typy statků. Ukazuje i důchodovou elasticitu v bodě.')}`),
  S('Substituční a důchodový efekt', R`
${idea('Když něco zlevní, stane se dvojí: je to relativně levnější než ostatní věci (substituční efekt) a zároveň jsi o trochu bohatší (důchodový efekt).')}
${def('Substituční efekt (SE)', 'je změna spotřeby, protože se změnily relativní ceny, při <i>stejném</i> užitku (pohyb po indiferenční křivce, E₁ → E₂). Vždy zvyšuje spotřebu zlevněného statku.')}
${def('Důchodový efekt (IE)', 'je změna spotřeby, protože se změnil reálný důchod (přesun na jinou indiferenční křivku, E₂ → E₃).')}
${tbl(['Statek', 'SE (cena ↓)', 'IE (cena ↓)', 'Celkem TE'], [['normální', '↑', '↑', '↑'], ['podřadný', '↑', '↓ (slabší)', '↑'], ['Giffenův', '↑', '↓ (silnější)', '↓']])}
<p>U druhého statku je SE opačný (nahrazuje se zlevněným) a IE zvyšuje jeho spotřebu.</p>
${fig('sie', 'Rozklad cenového efektu krok za krokem. Přepni typ statku a přehraj znovu.')}
${pit(['Každý Giffenův statek je podřadný, ne naopak.', 'MRS = sklon indiferenční křivky; \\(p_1/p_2\\) = sklon rozpočtové přímky.', 'Rovnost MU (bez dělení cenou) platí jen při stejných cenách.'])}`)] },

{ n: 6, title: 'Teorie firmy I: produkční funkce', short: 'Produkce',
  key: ['Krátké období: aspoň jeden vstup fixní; dlouhé: všechny variabilní.', 'MP = sklon TP; AP = TP/L. MP protíná AP v maximu AP; TP je max, když MP = 0.', 'Racionální výroba je ve II. stádiu (AP klesá, MP > 0).', 'MRTS = \\(MP_L/MP_K\\) = sklon izokvanty.', 'Výnosy z rozsahu: co se stane s výstupem, když zvětšíš <b>všechny</b> vstupy.'],
  secs: [
  S('Firma', R`
${def('Firma', 'je základní výrobní jednotka: najímá práci, kapitál a půdu, nakupuje další vstupy a vyrábí a prodává statky za účelem zisku.')}
<p>Proč firmy vznikají: technologie, výnosy z rozsahu, dělba práce a specializace, lepší přístup k financím, výzkum a vývoj, omezené ručení. <b>Zisk</b> = výnosy − náklady (mzdy, materiál, odpisy, úroky, fixní náklady na budovy a licence). Firma maximalizuje zisk, jinak dlouhodobě nepřežije.</p>
${tbl(['Forma podnikání v ČR', 'Druh'], [['živnost', 'fyzická osoba'], ['v.o.s., k.s.', 'osobní obchodní společnosti'], ['s.r.o., a.s.', 'kapitálové obchodní společnosti'], ['družstvo, evropská společnost', 'další']])}
<p>Trend: státních podniků od roku 2000 ubývá, akciových a obchodních společností přibývá.</p>`),
  S('Produkční funkce jednoho vstupu', R`
${idea('Produkční funkce říká, kolik se dá vyrobit z daných vstupů. Typicky: první pracovníci výrobu hodně zvednou, další už méně.')}
${def('Produkční funkce', '\\(q = f(x)\\) je maximální technologicky realizovatelný výstup při daném množství vstupu. Krátké období: \\(Q = f(\\bar K, L)\\); dlouhé období: \\(Q = F(K, L)\\).')}
<p>Typy: <b>konvexně-konkávní</b> (nejdřív rostoucí, pak klesající mezní produkt; typický případ), <b>ryze konkávní</b> (MP klesá od začátku) a <b>lineární</b> (konstantní MP do kapacity).</p>
${rule('Celkový, průměrný a mezní produkt', R`\[AP = \frac{TP}{x},\qquad MP = \frac{\Delta TP}{\Delta x} \approx \frac{dTP}{dx}\]<p>MP = sklon tečny k TP; AP = sklon spojnice počátku s bodem na TP. <b>Zákon klesajícího mezního produktu:</b> při fixních ostatních vstupech přidává každá další jednotka vstupu méně.</p>`)}`),
  S('Vztahy TP, AP a MP', R`
${idea('Mezní produkt je přínos posledního pracovníka, průměrný produkt přínos „průměrného“. Když je poslední lepší než průměr, průměr roste.')}
${fig('prod', 'TP, AP a MP pro \\(TP = 6L^2 - L^3/2\\): maximum MP (inflexe TP) při L = 4, maximum AP (MP = AP) při L = 6, maximum TP (MP = 0) při L = 8.')}
<ul><li>Do bodu A roste TP rostoucím tempem (MP roste); od A do C klesajícím tempem (platí zákon klesajícího MP); za C TP klesá a MP je záporný.</li><li>AP roste, když MP > AP; klesá, když MP &lt; AP; <b>v maximu AP je MP = AP</b>.</li><li><b>MP = 0</b>, když je TP maximální; AP = 0, když TP = 0.</li></ul>
${tbl(['Stádium', 'Co platí', 'Smysl'], [['I.', 'AP roste (MP > AP)', 'každý další vstup se vyplatí, přidávat'], ['II.', 'AP klesá, MP > 0', 'racionální oblast výroby'], ['III.', 'MP < 0, TP klesá', 'nerentabilní']])}
${ex('Kubická funkce (seminář 6)', R`<p>\(Q = 144L + 30L^2 - 2L^3\): \(MP_L = 144 + 60L - 6L^2\), \(AP_L = 144 + 30L - 2L^2\). Maximum MP: \(60 - 12L = 0 \Rightarrow L = 5\); od 5 pracovníků působí klesající výnosy z variabilního vstupu. Maximum AP: \(30 - 4L = 0 \Rightarrow L = 7{,}5\).</p>`)}
<p><b>Technologická změna</b> posune produkční funkci nahoru (víc kapacity za vyšší fixní náklady). <b>Dlouhodobá</b> produkční funkce je horní obálka krátkodobých.</p>`),
  S('Dva vstupy: izokvanty', R`
${idea('Izokvanta je jako indiferenční křivka, jen pro firmu: všechny kombinace práce a kapitálu, které dají stejný výstup.')}
${def('Izokvanta', 'jsou kombinace vstupů \\((x_1, x_2)\\), které dají stejný výstup; dál od počátku leží vyšší výstup.')}
${rule('MRTS a elasticita substituce', R`\[MRTS_{12} = -\frac{\Delta x_2}{\Delta x_1} = \frac{MP_1}{MP_2},\qquad \sigma = \frac{\%\Delta(x_2/x_1)}{\%\Delta(MP_1/MP_2)}\]<p>MRTS = sklon izokvanty; σ říká, jak snadno lze vstupy zaměňovat.</p>
${fig('isoq', 'Izokvanty tří typů produkčních funkcí. U Cobb-Douglasovy posouvej bod a sleduj MRTS.')}`)}
${tbl(['Funkce', 'Tvar', 'Izokvanty', 'σ'], [['lineární', '\\(a x_1 + b x_2\\)', 'přímky (dokonalé substituty)', '∞'], ['Leontiefova', '\\(\\min(a x_1, b x_2)\\)', 'tvar L (pevný poměr)', '0'], ['Cobb-Douglasova', '\\(A x_1^{\\alpha} x_2^{\\beta}\\)', 'hladké, konvexní', '1']])}`),
  S('Výnosy z rozsahu', R`
${idea('Zdvojnásobíš celou továrnu (lidi i stroje). Vyrobíš víc než dvakrát, přesně dvakrát, nebo míň?')}
${rule('Definice (dlouhé období)', R`<p>Všechny vstupy zvětšíme \(a\)-krát. <b>Rostoucí</b> výnosy: \(F(aK, aL) > aF(K, L)\); <b>konstantní</b>: \(=\); <b>klesající</b>: \(\lt\).</p>
${fig('rts', 'Výnosy z rozsahu na izokvantách: jak daleko od sebe jsou izokvanty pro 5, 10 a 15 jednotek.')}`)}
${tbl(['Příklad ze slidů', 'Výsledek'], [['F(K, L) = 10, F(2K, 2L) = 30', '30 > 20: rostoucí'], ['F(K, L) = 10, F(3K, 3L) = 20', '20 < 30: klesající'], ['F(K, L) = 10, F(2K, 2L) = 20', '20 = 20: konstantní']])}
<p>U Cobb-Douglasovy funkce rozhoduje \(\alpha + \beta\): > 1 rostoucí, = 1 konstantní, &lt; 1 klesající.</p>
${pit(['Klesající <b>mezní produkt</b> (jeden vstup, krátké období) ≠ klesající <b>výnosy z rozsahu</b> (všechny vstupy, dlouhé období).', 'Vstupy +100 %, výstup +80 % ⇒ klesající výnosy z rozsahu.', 'Krátké období se pozná podle fixního vstupu, ne podle kalendáře.'])}`)] },

{ n: 7, title: 'Teorie firmy II: optimalizace zisku a nákladů', short: 'Zisk, náklady',
  key: ['Ekonomický zisk = tržby − explicitní − implicitní náklady.', 'Maximum zisku: hodnota mezního produktu = cena vstupu, \\(p\\cdot MP = w\\).', 'Minimum nákladů: \\(MP_1/w_1 = MP_2/w_2\\), tedy MRTS = \\(w_1/w_2\\).', 'Lineární technologie: rohové řešení; Leontief: pevný poměr vstupů.', 'Reciprocita: při stejném výstupu mají obě úlohy stejné řešení.'],
  secs: [
  S('Výkazy firmy', R`
${tbl(['Výkaz', 'Co ukazuje'], [['rozvaha (balance sheet)', 'stav <b>aktiv</b> (co firma vlastní) a <b>pasiv</b> (z čeho to financovala: vlastní jmění, dluh) k určitému datu'], ['výsledovka (income statement)', 'výnosy a náklady za období'], ['cash-flow', 'zda budou v budoucnu stačit peněžní prostředky']])}`),
  S('Účetní a ekonomický zisk', R`
${idea('Účetní vidí jen to, co odešlo z účtu. Ekonom přičte i to, co sis nechal ujít (třeba plat, který bys jinde dostal).')}
${def('Účetní zisk', 'jsou výnosy minus explicitní (skutečně zaplacené) náklady.')}
${def('Ekonomický zisk', 'jsou výnosy minus <i>všechny</i> náklady, včetně implicitních nákladů příležitosti (ušlá mzda majitele, ušlý úrok z vlastního kapitálu). Nulový ekonomický zisk = firma vydělá tolik jako v nejlepší alternativě.')}
${ex('Kavárna', R`<p>Tržby 1 mil. Kč, explicitní náklady 700 tis. Kč ⇒ účetní zisk 300 tis. Majitel by jinde vydělal 400 tis. ⇒ ekonomický zisk −100 tis. Kč.</p>`)}`),
  S('Maximalizace zisku s jedním vstupem', R`
${idea('Najímej dalšího pracovníka, dokud ti vydělá víc (cena × jeho mezní produkt), než stojí jeho mzda.')}
<p>Model: dokonalá konkurence, firma neovlivní ceny vstupu ani výstupu. \(\pi = p\,q - w\,x\).</p>
${def('Izozisková přímka', 'spojuje kombinace vstupu a výstupu se stejným ziskem: \\(q = \\dfrac{\\pi}{p} + \\dfrac{w}{p}\\,x\\). Má kladný sklon \\(w/p\\); vyšší přímka = vyšší zisk.')}
${rule('Podmínka optima', R`<p>Nejvyšší izozisková přímka se dotkne produkční funkce:</p>\[\frac{d\pi}{dx} = p\cdot MP - w = 0 \quad\Rightarrow\quad p\cdot MP = w\]<p>Hodnota mezního produktu = cena vstupu, neboli \(MR = MC\). V krátkém období s fixním kapitálem: \(\pi = pq - r\bar k - wl\) a \(p\cdot MP_L = w\).</p>
${fig('isoprofit', 'Produkční funkce a izoziskové přímky. Změň reálnou mzdu w/p a sleduj, kde se nejvyšší izozisk dotkne funkce.')}`)}
${tbl(['Případ', 'Optimum'], [['technologie neumožňuje zisk (při daných cenách)', 'nevyrábět (E = 0)'], ['lineární \\(q = \\min(ax, b)\\), \\(w/p > a\\)', 'nevyrábět (E₁)'], ['lineární, \\(w/p \\lt a\\)', 'vyrábět na maximu kapacity (E₂)'], ['lineární, \\(w/p = a\\)', 'všechny body úsečky E₁E₂ stejně dobré'], ['výběr z technologií f₁, f₂, f₃', 'ta s nejvyšším ziskem; při vyšší ceně výstupu se vyplatí inovace']])}`),
  S('Minimalizace nákladů se dvěma vstupy', R`
${idea('Chceš vyrobit dané množství co nejlevněji: kombinuj práci a stroje tak, aby poslední koruna dala v obou stejný přínos.')}
${def('Izokosta', 'jsou kombinace vstupů se stejnými náklady: \\(C = w_1x_1 + w_2x_2\\), sklon \\(-w_1/w_2\\).')}
${rule('Podmínka optima', R`<p>Firma chce vyrobit \(q^*\) co nejlevněji: izokvanta se dotkne nejnižší izokosty.</p>\[MRTS = \frac{MP_1}{MP_2} = \frac{w_1}{w_2} \iff \frac{MP_1}{w_1} = \frac{MP_2}{w_2}\]<p>Poslední koruna dá v každém vstupu stejný mezní produkt. Zdraží-li práce, firma ji nahradí kapitálem.</p>
${fig('isocost', 'Izokvanta a izokosty. Zdraž práci a firma ji nahradí kapitálem.')}`)}
<ul><li><b>Lineární</b> produkční funkce: není-li sklon izokvanty stejný jako izokosty, používá se jen efektivnější vstup (rohové řešení).</li><li><b>Leontiefova</b> funkce \(\min(ax_1, bx_2)\): v optimu platí předepsaný poměr, \(ax_1 = bx_2\).</li></ul>`),
  S('Reciprocita', R`
<p>Maximalizace zisku a minimalizace nákladů nejsou totéž (nejde o dualitu). Platí ale <b>věta o reciprocitě</b>: předepíšeme-li firmě minimalizující náklady výstup, který by zvolila při maximalizaci zisku, obě úlohy mají stejné řešení.</p>
${pit(['Implicitní náklady patří do ekonomického zisku, utopené ne.', 'Sklon izozisku je \\(w/p\\), sklon izokosty \\(-w_1/w_2\\).'])}`)] },

{ n: 8, title: 'Teorie firmy III: nákladová funkce', short: 'Nákladové funkce',
  key: ['TC = FC + VC; FC = TC(0).', 'MC protíná AVC i AC v jejich minimu.', 'Bod ukončení činnosti: p = min AVC. Bod vyrovnání: p = min AC.', 'Krátkodobá nabídka firmy = MC nad min AVC; dlouhodobá = MC nad min AC.', 'Rozhoduje se podle nákladů příležitosti, utopené náklady se ignorují.'],
  secs: [
  S('Fixní a variabilní náklady', R`
${idea('Fixní náklady platíš, i když nic nevyrobíš (nájem). Variabilní rostou s každým kusem (materiál).')}
${def('Fixní náklady FC', 'se platí nezávisle na výstupu, i při nulové výrobě: vytápění haly, plat vrátného a účetní, nájem, licence, software, úroky z půjček, daň z nemovitosti.')}
${def('Variabilní náklady VC(q)', 'se mění s výstupem a při q = 0 jsou nulové: materiál, mzdy provozních zaměstnanců.')}
<p>\(TC(q) = FC + VC(q) = r\bar k + wl\). Tvar TC určuje produkční funkce: konvexně-konkávní produkce ⇒ konkávně-konvexní TC, která začíná na úrovni FC; lineární produkce ⇒ lineární TC.</p>
${fig('tc', 'Celkové, variabilní a fixní náklady. Tečna ukazuje mezní náklad, paprsek z počátku průměrný náklad.')}`),
  S('Průměrné a mezní náklady', R`
${idea('Mezní náklad je cena posledního kusu, průměrný náklad cena jednoho kusu v průměru. Když je poslední kus levnější než průměr, průměr klesá.')}
\[AFC = \frac{FC}{q},\quad AVC = \frac{VC}{q} = \frac{w}{AP_L},\quad AC = \frac{TC}{q} = AFC + AVC,\quad MC = \frac{dTC}{dq} = \frac{w}{MP_L}\]
<p>MC je sklon TC; AC je sklon spojnice počátku s bodem na TC.</p>
${fig('cost', 'Nákladové křivky. Nastav tržní cenu: firma vyrábí tam, kde p = MC, a uvidíš zisk nebo ztrátu.')}
<ul><li>MC klesá, dokud je každá další jednotka levnější než předchozí; pak roste.</li><li>AC klesá, dokud MC &lt; AC; <b>v minimu AC je MC = AC</b> (bod C); v minimu AVC je MC = AVC (bod B).</li><li>AC = AVC + AFC (svislý součet). AFC s výstupem klesá, AC se k AVC blíží, ale nedotkne se; AVC má minimum dřív než AC.</li><li>Dlouhodobá LAC je <b>dolní obálka</b> krátkodobých SAC.</li></ul>`),
  S('Dlouhé období: úspory z rozsahu', R`
${idea('V dlouhém období si firma vybere i velikost továrny. Pro malý výstup se hodí malá dílna, pro velký výstup velký závod.')}
${def('Dlouhodobé průměrné náklady LAC', 'jsou <b>dolní obálka</b> krátkodobých křivek SAC: pro každý výstup ukazují nejnižší průměrné náklady, když lze měnit všechny vstupy včetně velikosti závodu.')}
${tbl(['Část LAC', 'Co platí', 'Proč'], [['klesající', '<b>úspory z rozsahu</b> (rostoucí výnosy z rozsahu)', 'specializace, velké stroje, hromadný nákup'], ['minimum', 'minimální efektivní velikost', 'konstantní výnosy z rozsahu'], ['rostoucí', '<b>nehospodárnost z rozsahu</b> (klesající výnosy)', 'koordinace, byrokracie']])}
${fig('lac', 'Dlouhodobá LAC jako obálka pěti krátkodobých SAC. Posuň plánovaný výstup a uvidíš, která velikost závodu je nejlevnější.')}
<p>Když LAC klesá v celém rozsahu poptávky (síťová odvětví: voda, železnice), vyrobí trh nejlevněji jedna firma: <b>přirozený monopol</b>.</p>`),
  S('Ziskovost firmy', R`
${idea('Firma vyrábí tolik, aby poslední kus stál právě tolik, za kolik ho prodá (p = MC). Zavře, jen když nepokryje ani variabilní náklady.')}
<p>Firma maximalizuje \(\pi(q) = pq - TC(q)\): \(d\pi/dq = p - MC = 0\), tedy <b>\(p = MC\)</b> na rostoucí části MC.</p>
${tbl(['Cena', 'Zisk', 'Rozhodnutí'], [['\\(p > p_C\\)', '\\(\\pi > 0\\)', 'vyrábí se ziskem'], ['\\(p = p_C\\) (bod vyrovnání C: AC = p)', '\\(\\pi = 0\\), nulový nadstandardní zisk', 'vyrábí'], ['\\(p_B \\lt p \\lt p_C\\)', '\\(-FC \\lt \\pi \\lt 0\\), FC částečně pokryty', 'krátkodobě vyrábí'], ['\\(p \\lt p_B\\) (bod ukončení činnosti B: AVC = p)', '\\(\\pi \\lt -FC\\)', 'nevyrábí, ztráta = FC']])}
${rule('Nabídka firmy', R`<p>Krátkodobě kopíruje MC od bodu ukončení činnosti B; dlouhodobě od bodu vyrovnání C. Zisk: \(\pi = [p - AC(q^*)]\cdot q^*\).</p>`)}
${ex('Bod ukončení činnosti z kubické funkce', R`<p>\(TC = 50 + 20q - 4q^2 + 0{,}5q^3\): \(AVC = 20 - 4q + 0{,}5q^2\), minimum při \(q = 4\), \(\min AVC = 12\). Pod cenou 12 firma zavře.</p>`)}`),
  S('Racionalita firmy', R`
<p>Racionální firma vybírá rozhodnutí, které maximalizuje zisk. <b>Bere v úvahu náklady příležitosti</b> (ušlý zisk z odmítnuté zakázky; pokuta, které se vyhne instalací filtru; riziko při odmítnutí pojištění). <b>Ignoruje utopené náklady</b> (lístek na koncert, když prší; permanentka na vlek, když jsi unavený).</p>
${pit(['FC neovlivní MC ani optimální q, jen zisk a rozhodnutí o odchodu.', 'Firma ve ztrátě vyrábí dál, pokud pokryje aspoň AVC.', 'Bod ukončení činnosti = min AVC, bod vyrovnání = min AC.'])}`)] },

{ n: 9, title: 'Dokonalá a nedokonalá konkurence', short: 'Tržní struktury',
  key: ['Každá firma maximalizuje zisk při <b>MR = MC</b>.', 'DK: \\(p = MR\\), dlouhodobě \\(p = \\min AC\\) a nulový zisk.', 'Monopol: MR pod poptávkou, \\(q\\) z MR = MC, cena z poptávky; zisk trvá.', 'Monopol je alokačně i výrobně neefektivní (ztráta mrtvé váhy).', 'Vězňovo dilema: dominantní strategie vede k horšímu výsledku pro obě firmy.'],
  secs: [
  S('Tržní struktury', R`
${idea('Čím méně konkurentů, tím víc si firma může dovolit určovat cenu.')}
<p>Podle počtu firem a jejich tržní síly (kontrola nad cenou a výstupem): <b>dokonalá konkurence</b>, <b>monopolistická konkurence</b>, <b>oligopol</b>, <b>monopol</b>. Nedokonalá konkurence je i na straně poptávky: <b>monopson</b> (jeden kupující, stát jako zaměstnavatel policistů), <b>oligopson</b> (kakaové boby vykupují tři odběratelé).</p>`),
  S('Dokonalá konkurence', R`
${idea('Tisíce stejných farmářů prodávají stejné obilí. Nikdo z nich cenu neovlivní, jen se rozhodne, kolik vyrobí.')}
<p>Předpoklady: mnoho prodávajících i kupujících s dokonalou informovaností (jednotné ceny); <b>homogenní</b> produkt; firma je <b>příjemce ceny</b>; volný vstup a výstup; při tržní ceně neexistuje odbytové omezení, nad ní se neprodá nic.</p>
${rule('Příjmy a optimum', R`<p>\(AR = TR/q = p\), \(MR = dTR/dq = p\), tedy \(MR = D = AR = p\). Poptávka po produkci jedné firmy je vodorovná (nekonečně elastická). Optimum: \(MC(q^*) = p\).</p>
${fig('pc', 'Trh a jedna firma vedle sebe. Přehraj, jak kladný zisk přiláká nové firmy a cena se vrátí na min AC.')}`)}
<p><b>Krátké období:</b> firma vyrábí na MC nad bodem B; při \(p \lt p_C\) má ztrátu, ale výroba ji zmenšuje. <b>Dlouhé období:</b> vstup a odchod firem stlačí cenu na \(p^* = \min AC\); zisk je nulový, výroba maximálně efektivní a \(MC = p = MU\).</p>`),
  S('Nedokonalá konkurence', R`<p>Stačí porušit jednu podmínku DK: méně výrobců, nedokonalá informovanost (různé ceny), heterogenní produkt, firma je <b>tvůrce ceny</b>, bariéry vstupu, náklady zákazníka na změnu dodavatele.</p>`),
  S('Monopol', R`
${idea('Monopol je jediný prodávající. Zjistí, že když vyrobí méně, může prodávat dráž, a vydělá víc.')}
<p>Jediný prodávající s úplnou kontrolou odvětví, <b>nepřekonatelné bariéry</b>, žádné blízké substituty; individuální poptávka = tržní poptávka. Vzniká kvůli úsporám z rozsahu (<b>přirozený monopol</b>: síťová odvětví), jedinečnému zdroji (jediné naleziště), státní regulaci (Česká pošta) nebo inovaci (patent).</p>
${rule('Postup: zisk monopolu', R`<ol><li>Optimální výstup: \(MR(q^*) = MC(q^*)\).</li><li>Prodejní cena z poptávky: \(p^* = D(q^*)\).</li><li>Průměrné náklady: \(AC(q^*)\).</li><li>Zisk: \(\pi = [p^* - AC(q^*)]\cdot q^*\).</li></ol><p>Pro lineární poptávku \(p = a - bq\): \(TR = aq - bq^2\), <b>\(MR = a - 2bq\)</b> (dvakrát strmější). Monopol nemá nabídkovou křivku.</p>`)}
${fig('mono', 'Monopol vyrábí méně a dráž než dokonalá konkurence; vzniká ztráta mrtvé váhy.')}
${rule('Proč je monopol neefektivní', R`<p><b>Alokačně:</b> \(p^* > MC\); existují kupující, kteří by zaplatili víc, než stojí výroba, ale nekoupí, protože nelze prodávat stejné zboží za různé ceny ⇒ ztráta mrtvé váhy. Nedokonalá konkurence je i <b>Pareto-neefektivní</b> (Pareto-efektivní je situace, kdy si nikdo nemůže polepšit, aniž by si jiný pohoršil, např. DK v dlouhém období). <b>Výrobně:</b> nevyrábí v minimu AC. Bariéry vstupu drží zisk kladný krátkodobě i dlouhodobě.</p>`)}
${def('Cenová diskriminace', 'je prodej stejného zboží různým zákazníkům za různé ceny podle jejich ochoty platit. Monopol tak zachytí část přebytku spotřebitele a prodá i těm, kteří by za jednotnou cenu nekoupili, takže ztráta mrtvé váhy se zmenší.')}
${tbl(['Stupeň', 'Jak funguje', 'Příklad'], [['1. (dokonalá)', 'každý platí svou maximální ochotu; přebytek spotřebitele = 0, ztráta mrtvé váhy = 0', 'aukce, smlouvání na trhu'], ['2.', 'cena závisí na množství', 'množstevní slevy, tarify'], ['3.', 'různé ceny pro skupiny zákazníků', 'studentské a seniorské slevy, ceny letenek']])}
<p>Podmínky: firma má tržní sílu, umí zákazníky rozlišit a zabrání přeprodeji.</p>`),
  S('Monopolistická konkurence', R`
${idea('Kavárny ve městě: každá je trochu jiná (tvoří cenu), ale snadno vznikne další (zisky dlouhodobě zmizí).')}<p>Mnoho firem, <b>diferencovaný</b> produkt (tvůrci ceny, ale blízké substituty), nízké náklady vstupu, nenulové náklady zákazníka na změnu dodavatele. Krátkodobě kladný zisk jako monopol; dlouhodobě vstupují konkurenti, dokud \(AR = AC\) (nulový zisk), ale <b>ne v minimu AC</b> (nadbytečná kapacita).</p>
${fig('monocomp', 'Monopolistická konkurence krátkodobě a dlouhodobě: poptávka po produktu firmy klesá, dokud zisk nezmizí.')}`),
  S('Oligopol', R`
${idea('Pár velkých firem (operátoři, Coca-Cola a Pepsi), které se navzájem sledují. Co udělá jedna, ovlivní ostatní.')}
<p>Poptávka je rozdělena mezi několik soupeřících firem; produkt homogenní i diferencovaný; překonatelné, ale vysoké bariéry vstupu.</p>
${tbl(['Model', 'Chování'], [['dominantní firma a lem', 'Vůdce se chová jako monopol (\\(MR_L = MC_L\\)) a určí cenu \\(p_L\\); lem ji převezme a vyrábí, kde \\(p_L = MC_F\\). Celkem \\(q_M = q_L + q_F\\). Nad cenou \\(p_A\\) vyrábí jen lem, pod \\(p_B\\) jen vůdce.'], ['kartel (koluzní oligopol)', 'Nekalá dohoda o cenách nebo omezení výstupu; maximalizuje zisk jako monopol. Je nestabilní, každý má motiv podvádět.']])}
${fig('domfirm', 'Dominantní firma a konkurenční lem. Měň mezní náklady vůdce.')}
${rule('Vězňovo dilema (Coca-Cola a Pepsi)', R`${tbl(['tržby (mil. $), Cola / Pepsi', 'Pepsi $7', 'Pepsi $5'], [['Cola $7', '15 / 15', '5 / 30'], ['Cola $5', '30 / 5', '<b>10 / 10</b>']])}<p>Zlevnit se vyplatí bez ohledu na soupeře (<b>dominantní strategie</b>), takže obě skončí na 10 místo 15. Sledování vlastního zájmu vede k horšímu výsledku pro obě.</p>`)}
${fig('pd', 'Vězňovo dilema: vyber ceny obou firem. Hvězdička označuje Nashovu rovnováhu.')}
${pit(['V DK je MR = p, v monopolu MR < p.', 'Monopol nevyrábí na neelastické části poptávky (tam MR < 0).', 'Nulový ekonomický zisk ≠ nulový účetní zisk.'])}`)] },

{ n: 10, title: 'Antimonopolní politika a nerovnost', short: 'Tržní síla, nerovnost',
  key: ['CR = součet podílů největších firem; HHI = součet čtverců podílů všech (0–10 000).', 'Lernerův index \\((p - MC)/p\\): 0 v DK, k 1 u monopolu.', 'ÚOHS: zakázané dohody, zneužití dominance (~40 %), kontrola fúzí.', 'Lorenzova křivka a Gini \\(= A/(A+B)\\): 0 rovnost, 1 nerovnost.', 'Příjem je tok, bohatství stav; nejdůležitější je spotřeba (životní úroveň).'],
  secs: [
  S('Měření tržní síly', R`
${idea('Jak poznat, že je trh ovládaný pár firmami? Sečti jejich podíly (CR), nebo jejich čtverce (HHI), aby velké firmy vážily víc.')}
<p>Strukturu trhu určuje počet firem, bariéry vstupu a tržní síla (jak firma ovlivní cenu a množství).</p>
\[CR_n = \sum_{i=1}^{n} S_i,\qquad HHI = \sum_{i=1}^{N} S_i^2,\qquad L = \frac{p - MC}{p}\]
${tbl(['Ukazatel', 'Rozsah', 'Pozn.'], [['koncentrační poměr \\(CR_n\\)', '0–100 %', 'jen n největších firem'], ['Herfindahlův index', '≈0 (DK) až 10 000 (monopol)', 'všechny firmy, podíly v %; citlivý na velké firmy'], ['Lernerův index', '0 (DK) až 1', 'teoreticky nejlepší, ale MC se v praxi těžko zjišťuje; monopol \\(L = 1/|\\varepsilon|\\)']])}
${ex('Čtyři firmy', R`<p>Podíly 40, 30, 20, 10 %: \(CR_2 = 70\,\%\), \(HHI = 1600 + 900 + 400 + 100 = 3000\).</p>
${fig('hhi', 'Koncentrační poměr a Herfindahlův index. Nastav podíly čtyř největších firem.')}`)}`),
  S('Porovnání tržních struktur', R`

/* ---------- interaktivní grafy (SVG + posuvníky + animované kroky) ----------
   <figure data-fig="id"><figcaption>…</figcaption></figure> → initFigs(root) vloží graf.
   FIGDEF[id] = { ctl: [[klíč, popis, min, max, krok, výchozí]], opt: [[klíč, popis, [[hodnota, text]…], výchozí]],
                  hid: {skryté hodnoty}, steps: [[název, {hodnoty}, vysvětlení]], draw(v) → HTML } */
const FW = 600, FH = 400;
let CLIPN = 0;
function plane(xmax, ymax, o = {}) {
  const W = o.w || FW, H = o.h || FH, ox = o.ox || 0, oy = o.oy || 0, m = Object.assign({ l: 58, r: 28, t: 24, b: 50 }, o.m || {});
  const sx = x => ox + m.l + (x / xmax) * (W - m.l - m.r), sy = y => oy + H - m.b - (y / ymax) * (H - m.t - m.b);
  const f1 = v => (+v).toFixed(1);
  const P = pts => pts.map(([x, y], i) => (i ? 'L' : 'M') + f1(sx(x)) + ' ' + f1(sy(y))).join(' ');
  const fn = (f, a, b, n = 90) => { const pts = []; for (let i = 0; i <= n; i++) { const x = a + (b - a) * i / n, y = f(x); if (isFinite(y)) pts.push([x, Math.max(-ymax * .2, Math.min(ymax * 1.3, y))]); } return P(pts); };
  const id = 'fc' + (++CLIPN);
  const clip = inner => `<defs><clipPath id="${id}"><rect x="${sx(0)}" y="${sy(ymax)}" width="${sx(xmax) - sx(0)}" height="${sy(0) - sy(ymax)}"/></clipPath></defs><g clip-path="url(#${id})">${inner}</g>`;
  const poly = (pts, cls) => `<path class="${cls}" d="${P(pts)} Z"/>`;
  const line = (x1, y1, x2, y2, cls = 'gd') => `<line class="${cls}" x1="${f1(sx(x1))}" y1="${f1(sy(y1))}" x2="${f1(sx(x2))}" y2="${f1(sy(y2))}"/>`;
  const sub = s => String(s).replace(/_\{([^}]+)\}|_(\w+)/g, (_, a, b) => `<tspan baseline-shift="sub" font-size="72%">${a || b}</tspan>`);
  const txt = (x, y, s, cls = '', anchor = 'start', dx = 0, dy = 0) => `<text class="${cls}" x="${f1(sx(x) + dx)}" y="${f1(sy(y) + dy)}" text-anchor="${anchor}">${sub(s)}</text>`;
  const lab = (x, y, s, c = 'K', anchor = 'start', dx = 0, dy = 0) => txt(x, y, s, 'lb t' + c, anchor, dx, dy);
  const dot = (x, y, cls = 'dt', r = 5) => `<circle class="${cls}" cx="${f1(sx(x))}" cy="${f1(sy(y))}" r="${r}"/>`;
  const cur = (d, c = 'D', dashed = false) => `<path class="cv c${c}${dashed ? ' old' : ''}"${dashed ? '' : ' pathLength="1"'} d="${d}"/>`;
  const ticks = (xt = [], yt = []) => xt.map(t => `<line class="tick" x1="${f1(sx(t))}" x2="${f1(sx(t))}" y1="${f1(sy(0))}" y2="${f1(sy(0) + 5)}"/><text class="tk" x="${f1(sx(t))}" y="${f1(sy(0) + 20)}" text-anchor="middle">${num(t, 2)}</text>`).join('')
    + yt.map(t => `<line class="tick" x1="${f1(sx(0) - 5)}" x2="${f1(sx(0))}" y1="${f1(sy(t))}" y2="${f1(sy(t))}"/><text class="tk" x="${f1(sx(0) - 9)}" y="${f1(sy(t) + 5)}" text-anchor="end">${num(t, 2)}</text>`).join('');
  const axes = (xl, yl, xt, yt) => `<line class="ax" x1="${sx(0)}" y1="${sy(0)}" x2="${sx(xmax) + 10}" y2="${sy(0)}"/><line class="ax" x1="${sx(0)}" y1="${sy(0)}" x2="${sx(0)}" y2="${sy(ymax) - 10}"/>`
    + `<path class="axh" d="M${sx(xmax) + 14} ${sy(0)} l-8 -4 v8 z M${sx(0)} ${sy(ymax) - 14} l-4 8 h8 z"/>`
    + `<text class="axl" x="${sx(xmax) + 12}" y="${sy(0) + 38}" text-anchor="end">${sub(xl)}</text><text class="axl" x="${sx(0) + 12}" y="${sy(ymax) - 2}" text-anchor="start">${sub(yl)}</text>` + ticks(xt, yt);
  const guide = (x, y, lx, ly, cls = 'gd') => line(x, 0, x, y, cls) + line(0, y, x, y, cls) + (lx ? txt(x, 0, lx, 'gl', 'middle', 0, 22) : '') + (ly ? txt(0, y, ly, 'gl', 'end', -9, 5) : '');
  const arrow = (x1, y1, x2, y2, cls = 'arr') => { const X1 = sx(x1), Y1 = sy(y1), X2 = sx(x2), Y2 = sy(y2), a = Math.atan2(Y2 - Y1, X2 - X1), L = Math.hypot(X2 - X1, Y2 - Y1); if (L < 6) return ''; const h = 10, w = 5.5, bx = X2 - h * Math.cos(a), by = Y2 - h * Math.sin(a);
    return `<g class="${cls}"><line x1="${f1(X1)}" y1="${f1(Y1)}" x2="${f1(bx)}" y2="${f1(by)}"/><path d="M${f1(X2)} ${f1(Y2)} L${f1(bx - w * Math.sin(a))} ${f1(by + w * Math.cos(a))} L${f1(bx + w * Math.sin(a))} ${f1(by - w * Math.cos(a))} Z"/></g>`; };
  const shade = (x1, x2, cls) => `<rect class="${cls}" x="${f1(sx(x1))}" y="${f1(sy(ymax))}" width="${f1(sx(x2) - sx(x1))}" height="${f1(sy(0) - sy(ymax))}"/>`;
  return { sx, sy, P, fn, poly, line, txt, lab, dot, cur, axes, guide, arrow, clip, shade, xmax, ymax };
}
const svgWrap = (inner, w = FW, h = FH, label = '') => `<svg class="fg eg" viewBox="0 0 ${w} ${h}" role="img"${label ? ` aria-label="${label}"` : ''}>${inner}</svg>`;
const leg = items => `<div class="flegend">${items.map(([c, t]) => `<span><i class="${c}"></i>${t}</span>`).join('')}</div>`;
const stat = s => `<p class="fstat">${s}</p>`;
const n1 = x => num(x, 1), n0 = x => num(x, 0), n2 = x => num(x, 2);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

const FIGDEF = {};

/* ===== 1. přednáška ===== */
FIGDEF.marg = { ctl: [['q', 'Kolik jednotek uděláš (q)', 0, 10, 0.5, 2]],
  steps: [['Málo', { q: 2 }, 'Při q = 2 je mezní přínos další jednotky (8) vyšší než mezní náklad (2,6). Přidat se vyplatí.'], ['Optimum', { q: 5 }, 'Při q = 5 se mezní přínos rovná meznímu nákladu. Celkový čistý přínos (zelená plocha) je největší.'], ['Moc', { q: 8 }, 'Za q = 5 stojí každá další jednotka víc, než přinese. Červená plocha čistý přínos zmenšuje.']],
  draw(v) {
    const g = plane(10, 12), MB = q => 10 - q, MC = q => 1 + 0.8 * q, q = v.q, opt = 5;
    const ptsG = [], ptsR = [];
    for (let i = 0; i <= 40; i++) { const x = Math.min(q, opt) * i / 40; ptsG.push([x, MB(x)]); }
    for (let i = 40; i >= 0; i--) { const x = Math.min(q, opt) * i / 40; ptsG.push([x, MC(x)]); }
    if (q > opt) { for (let i = 0; i <= 30; i++) { const x = opt + (q - opt) * i / 30; ptsR.push([x, MC(x)]); } for (let i = 30; i >= 0; i--) { const x = opt + (q - opt) * i / 30; ptsR.push([x, MB(x)]); } }
    const NB = x => 9 * x - 0.9 * x * x, nb = q <= opt ? NB(q) : NB(opt) - 0.9 * (q - opt) ** 2;
    return svgWrap(g.axes('množství q', 'Kč', [2, 4, 5, 6, 8, 10], [2, 4, 6, 8, 10]) + (q > 0 ? g.poly(ptsG, 'a-ps') : '') + (ptsR.length ? g.poly(ptsR, 'a-dwl') : '')
      + g.cur(g.P([[0, 10], [10, 0]]), 'D') + g.cur(g.P([[0, 1], [10, 9]]), 'S') + g.lab(9.6, MB(9.6), 'mezní přínos MB', 'D', 'end', 0, -12) + g.lab(9.6, MC(9.6), 'mezní náklad MC', 'S', 'end', 0, -12)
      + g.dot(opt, 5, 'dt o') + g.lab(opt, 5, 'MB = MC', 'K', 'start', 10, 22) + (q > 0 ? g.line(q, 0, q, 11.5, 'reg') + g.lab(q, 11.5, 'q = ' + n1(q), 'K', 'middle', 0, -4) : ''))
      + leg([['a-ps', 'čistý přínos (MB > MC)'], ['a-dwl', 'ztráta z přehnání (MC > MB)']])
      + stat(`Při q = <b>${n1(q)}</b>: další jednotka přinese ${n1(MB(q))} a stojí ${n1(MC(q))} → ${q < opt ? '<b>ještě přidat</b>' : q > opt ? '<b>ubrat</b>' : '<b>tady přestat</b>'}. Celkový čistý přínos = <b>${n1(nb)}</b> (maximum 22,5 při q = 5).`);
  } };

FIGDEF.circ = { opt: [['st', 'Model', [[0, 'Čistě tržní ekonomika'], [1, 'Smíšená ekonomika (se státem)']], 0]],
  draw(v) {
    const box = (x, y, w, h, t, s, cls = '') => `<rect class="cbox ${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="14"/><text class="cbt" x="${x + w / 2}" y="${y + h / 2 - (s ? 4 : -5)}" text-anchor="middle">${t}</text>${s ? `<text class="cbs" x="${x + w / 2}" y="${y + h / 2 + 16}" text-anchor="middle">${s}</text>` : ''}`;
    const flow = (d, cls, dur) => `<path class="cfl ${cls}" d="${d}"/>${reduceMotion() ? '' : [0, 1, 2].map(i => `<circle class="cdot ${cls}" r="4.5"><animateMotion dur="${dur}s" begin="${-i * dur / 3}s" repeatCount="indefinite" path="${d}"/></circle>`).join('')}`;
    const R = ['M510 160 V52 H402', 'M198 52 H90 V160', 'M90 240 V348 H198', 'M402 348 H510 V240'], Mn = ['M130 160 V72 H198', 'M402 72 H470 V160', 'M470 240 V328 H402', 'M198 328 H130 V240'];
    const t = (x, y, s, a = 'middle') => `<text class="cft" x="${x}" y="${y}" text-anchor="${a}">${s}</text>`;
    let s = box(200, 22, 200, 60, 'Trh zboží a služeb', 'firmy prodávají, domácnosti kupují') + box(200, 318, 200, 60, 'Trh výrobních faktorů', 'domácnosti prodávají, firmy kupují')
      + box(14, 160, 152, 80, 'Domácnosti', 'kupují statky, vlastní faktory', 'hh') + box(434, 160, 152, 80, 'Firmy', 'vyrábějí, najímají faktory', 'fi')
      + R.map(d => flow(d, 'real', 7)).join('') + Mn.map(d => flow(d, 'money', 7)).join('')
      + t(300, 16, 'zboží a služby →  (tok statků)') + t(300, 104, '← výdaje = příjem firem (tok peněz)') + t(300, 300, 'mzda, renta, zisk → důchod domácností') + t(300, 396, '← práce, půda, kapitál');
    if (+v.st) s += box(236, 172, 128, 56, 'Stát', 'daně · transfery', 'st')
      + `<path class="cfl gov" d="M166 186 H234"/><path class="cfl gov" d="M234 214 H166"/><path class="cfl gov" d="M434 186 H366"/><path class="cfl gov" d="M366 214 H434"/>`
      + `<text class="cft" x="200" y="180" text-anchor="middle">daně</text><text class="cft" x="200" y="232" text-anchor="middle">transfery</text><text class="cft" x="400" y="180" text-anchor="middle">daně</text><text class="cft" x="400" y="232" text-anchor="middle">veřejné statky</text>`;
    return svgWrap(s, 600, 404, 'Ekonomický koloběh') + leg([['l-real', 'tok statků a výrobních faktorů'], ['l-money', 'tok peněz (opačným směrem)']])
      + stat(+v.st ? 'Stát vybírá od domácností i firem <b>daně</b> a vrací <b>transfery</b> (důchody, dávky) a <b>veřejné statky</b> (silnice, obrana). Model je statický: nezachycuje toky do zahraničí ani boj o monopol (Schumpeter).' : 'Dva trhy, dva toky. <b>Statky a faktory</b> tečou jedním směrem, <b>peníze</b> opačným. Co domácnost utratí, je příjem firmy; co firma zaplatí za faktory, je důchod domácnosti.');
  } };

FIGDEF.ppf = { ctl: [['pos', 'Kde na PPF vyrábíš (podíl statku X)', 0.05, 0.9, 0.01, 0.35], ['res', 'Množství zdrojů', 0.75, 1.3, 0.05, 1], ['tech', 'Technologie jen ve výrobě X', 1, 1.5, 0.05, 1]],
  steps: [['Tři typy bodů', { pos: 0.35, res: 1, tech: 1 }, 'A leží na hranici: vyrábí se efektivně. B je uvnitř: část zdrojů se nevyužívá (nezaměstnanost). C je mimo: s danými zdroji ho nedosáhneš.'],
    ['Pohyb po křivce', { pos: 0.75 }, 'Realokace zdrojů: víc X, ale méně Y. Všimni si, že každá další jednotka X teď stojí víc Y (trojúhelník je vyšší): rostoucí náklady příležitosti.'],
    ['Posun ven', { pos: 0.5, res: 1.25 }, 'Víc zdrojů (práce, kapitál) nebo lepší technologie v obou odvětvích: celá PPF se posune ven. To je ekonomický růst (expanze).'],
    ['Pootočení', { res: 1, tech: 1.45 }, 'Lepší technologie jen ve výrobě X: průsečík s osou X se posune ven, průsečík s osou Y zůstane. PPF se pootočí.']],
  draw(v) {
    const g = plane(16, 15), X = 10 * v.res * v.tech, Y = 10 * v.res, f = x => Y * Math.sqrt(Math.max(0, 1 - (x / X) ** 2));
    const x = v.pos * X, y = f(x), x2 = Math.min(X, x + 1), y2 = f(x2), oc = y - y2;

      + `<path class="a-cs" d="${g.fn(f, 0, X, 120)} L${g.sx(X)} ${g.sy(0)} L${g.sx(0)} ${g.sy(0)} Z"/>` + g.cur(g.fn(f, 0, X, 140), 'D') + g.lab(X * 0.86, f(X * 0.86), 'PPF', 'D', 'start', 8, -6)
      + g.line(x, y, x2, y, 'tri') + g.line(x2, y, x2, y2, 'tri2') + g.lab(x2, (y + y2) / 2, 'OC = ' + n2(oc), 'R', 'start', 6, 4) + g.lab((x + x2) / 2, y, '+1 X', 'K', 'middle', 0, -8)
      + g.dot(x, y) + g.lab(x, y, 'A', 'K', 'end', -8, -6) + g.dot(4, 4, 'dt o') + g.lab(4, 4, 'B uvnitř', 'K', 'start', 9, 5) + g.dot(13, 12.5, 'dt x') + g.lab(13, 12.5, 'C mimo', 'R', 'start', 9, 5))
      + leg([['a-cs', 'množina produkčních možností'], ['l-tri', 'náklad příležitosti další jednotky X']])
      + stat(`V bodě A se vyrábí <b>${n1(x)}</b> X a <b>${n1(y)}</b> Y. Další jednotka X stojí <b>${n2(oc)}</b> jednotek Y. ${v.res > 1.001 ? 'Zdrojů je víc: PPF je dál od počátku.' : v.res < 0.999 ? 'Zdrojů je méně: PPF se posunula k počátku.' : ''} ${v.tech > 1.001 ? 'Technologie ve výrobě X PPF pootočila.' : ''}`);
  } };

FIGDEF.ppfshape = { opt: [['s', 'Tvar PPF', [['c', 'Konkávní (rostoucí OC)'], ['l', 'Přímka (konstantní OC)'], ['v', 'Konvexní (klesající OC)']], 'c']], ctl: [['k', 'Kolik králíků uloví', 0, 5, 1, 1]],
  steps: [['Rostoucí OC', { s: 'c', k: 4 }, 'Bobule klesají o 20, 40, 60, 80, 100: každý další králík stojí víc bobulí. Křivka je vypouklá ven (konkávní).'], ['Konstantní OC', { s: 'l', k: 4 }, 'Každý králík stojí vždy 60 bobulí: PPF je přímka.'], ['Klesající OC', { s: 'v', k: 4 }, 'Úbytek bobulí se zmenšuje (100, 80, 60, …): rostoucí výnosy, křivka je prohnutá k počátku (konvexní).']],
  draw(v) {
    const T = { c: [300, 280, 240, 180, 100, 0], l: [300, 240, 180, 120, 60, 0], v: [300, 200, 120, 60, 20, 0] }[v.s], k = Math.round(v.k), g = plane(5.5, 330);

    s += T.map((y, i) => g.dot(i, y, i === k ? 'dt' : 'dt o', i === k ? 6 : 4)).join('') + g.lab(k, T[k], 'ABCDEF'[k], 'K', 'start', 10, -8);
    return svgWrap(s) + stat(`Bod ${'ABCDEF'[k]}: ${k} králíků a ${T[k]} bobulí. ${k ? `Králík č. ${k} stál <b>${T[k - 1] - T[k]}</b> bobulí.` : 'Zatím se loví jen bobule.'} Náklady příležitosti jsou ${v.s === 'c' ? '<b>rostoucí</b> (zdroje nejsou pro obě činnosti stejně vhodné)' : v.s === 'l' ? '<b>konstantní</b>' : '<b>klesající</b>'}.`);

FIGDEF.trade = { opt: [['t', 'Situace', [[0, 'Bez obchodu'], [1, 'Specializace a směna']], 0]], ctl: [['p', 'Cena 1 stolu v židlích', 0.25, 4, 0.05, 1]],
  steps: [['Bez obchodu', { t: 0 }, 'Každý vyrábí obojí a spotřebovává jen na své PPF: Červený (15 Ž, 5 S), Modrý (5 Ž, 15 S).'], ['Specializace', { t: 1, p: 1 }, 'Červený vyrábí jen židle (komparativní výhoda), Modrý jen stoly. Vymění 15 židlí za 15 stolů. Oba se dostanou <b>za svou PPF</b>.'], ['Příliš drahý stůl', { t: 1, p: 3.5 }, 'Za cenu nad 3 židle za stůl by Červený platil víc, než kolik stůl stojí jeho vlastní výrobou. Obchod se mu nevyplatí.']],

    let s = g.axes('židle Ž', 'stoly S', [10, 15, 20, 30], [10, 20, 30, 40]) + g.cur(g.P([[0, 10], [30, 0]]), 'S') + g.cur(g.P([[0, 30], [10, 0]]), 'D')
      + g.lab(21, 3.2, 'PPF Červený', 'S', 'start', 4, -6) + g.lab(5, 15, 'PPF Modrý', 'D', 'start', 8, 0);

    if (t) { const yC = Math.min(45, cC[1]), yM = Math.max(-2, cM[1]);
      s += g.dot(30, 0, 'dt x') + g.dot(0, 30, 'dt x') + g.arrow(15, 5, 15, yC, 'arr cS') + g.arrow(5, 15, 15, yM, 'arr cD')

  } };

FIGDEF.sd = { ctl: [['dd', 'Posun poptávky', -30, 30, 2, 0], ['ds', 'Posun nabídky', -30, 30, 2, 0]],
  steps: [['Rovnováha', { dd: 0, ds: 0 }, 'Poptávka a nabídka se protínají v bodě E₀: p* = 22,5, q* = 55. Tam se poptávané a nabízené množství rovná.'], ['Poptávka ↑', { dd: 20, ds: 0 }, 'Vzroste důchod (normální statek) nebo zdraží substitut: poptávka se posune doprava. Cena i množství vzrostou.'], ['Nabídka ↑', { dd: 0, ds: 20 }, 'Lepší technologie nebo levnější vstupy: nabídka se posune doprava. Cena klesne, množství vzroste.'], ['Nabídka ↓', { dd: 0, ds: -20 }, 'Zdraží vstupy (ropa): nabídka doleva. Cena vzroste, množství klesne.'], ['Obojí ↑', { dd: 20, ds: 20 }, 'Rostou obě křivky: množství určitě vzroste, cena záleží na tom, která se posune víc (tady stejně, takže se nezmění).']],

    const dP = d => g.P([[D(0, d), 0], [0, (100 + d) / 2]]), sP = s => g.P([[Math.max(0, 10 + s), Math.max(0, -(10 + s) / 2)], [S(58, s), 58]]);
    const moved = Math.abs(v.dd) > .5 || Math.abs(v.ds) > .5;
    let s = g.axes('množství Q', 'cena p', [20, 55, 100], [10, 22.5, 40]);
    if (moved) s += g.cur(dP(0), 'D', true) + g.cur(sP(0), 'S', true) + g.dot(55, 22.5, 'dt o') + g.lab(55, 22.5, 'E₀', 'K', 'end', -8, -8);

  } };

FIGDEF.excess = { ctl: [['p', 'Cena na trhu', 4, 42, 0.5, 34]],
  steps: [['Cena moc vysoko', { p: 34 }, 'Při ceně 34 chtějí výrobci prodat 78, ale kupující koupí jen 32. Převis nabídky: výrobci se podbízejí a cena klesá.'], ['Cena moc nízko', { p: 10 }, 'Při ceně 10 chtějí kupující 80, ale nabízí se jen 30. Převis poptávky: kupující přeplácejí a cena roste.'], ['Rovnováha', { p: 22.5 }, 'Při p* = 22,5 se poptávané a nabízené množství rovná (55). Nikdo nemá důvod cenu měnit.']],
  draw(v) {
    const g = plane(130, 50), p = v.p, qD = 100 - 2 * p, qS = 10 + 2 * p, eq = Math.abs(p - 22.5) < .3;
    let s = g.axes('množství Q', 'cena p', [qD, qS].filter((x, i, a) => !eq || i === 0).map(x => +x.toFixed(1)), [p]) + g.cur(g.P([[100, 0], [0, 50]]), 'D') + g.cur(g.P([[10, 0], [110, 50]]), 'S')
      + g.lab(8, 46, 'D', 'D', 'start', 6, 0) + g.lab(104, 47, 'S', 'S', 'end', -8, 0) + g.dot(55, 22.5, 'dt o');
    if (!eq) s += `<path class="${p > 22.5 ? 'a-surp' : 'a-short'}" d="${g.P([[Math.min(qD, qS), p - .9], [Math.max(qD, qS), p - .9], [Math.max(qD, qS), p + .9], [Math.min(qD, qS), p + .9]])} Z"/>`
      + g.lab((qD + qS) / 2, p, p > 22.5 ? `převis nabídky ${n1(qS - qD)}` : `převis poptávky ${n1(qD - qS)}`, p > 22.5 ? 'G' : 'R', 'middle', 0, -12) + g.arrow(4, p, 4, p + (p > 22.5 ? -7 : 7), 'arr cK');
    s += g.line(0, p, 130, p, 'reg') + g.dot(qD, p, 'dt') + g.dot(qS, p, 'dt') + g.lab(qD, p, 'q_D', 'D', 'middle', 0, 24) + g.lab(qS, p, 'q_S', 'S', 'middle', 0, 24);
    return svgWrap(s) + stat(eq ? 'Rovnováha: q_D = q_S = 55. Trh se vyčistil.'.replace(/_D|_S/g, m => m === '_D' ? '<sub>D</sub>' : '<sub>S</sub>') : `Při ceně ${n1(p)} se poptává ${n1(qD)} a nabízí ${n1(qS)}. ${p > 22.5 ? '<b>Přebytek zboží</b> → cena klesá.' : '<b>Nedostatek zboží</b> → cena roste.'}`);
  } };

FIGDEF.mktsum = { ctl: [['p', 'Cena', 0.5, 7, 0.5, 3]],
  steps: [['p = 1', { p: 1 }, 'Spotřebitel 1 chce 2 kusy, spotřebitel 2 osm. Trh: 2 + 8 = 10.'], ['p = 3', { p: 3 }, 'Spotřebitel 1 chce 1, spotřebitel 2 pět. Trh: 6.'], ['p = 5', { p: 5 }, 'Spotřebitel 1 už nekoupí nic, spotřebitel 2 dva kusy. Trh: 2. Proto má tržní poptávka zlom.']],
  draw(v) {
    const Q1 = p => Math.max(0, (5 - p) / 2), Q2 = p => Math.max(0, 9.5 - 1.5 * p), p = v.p, W = 200, o = { w: W, h: 320, m: { l: 40, r: 14, t: 20, b: 46 } };
    const pan = (k, xm, f, t, c) => { const g = plane(xm, 9, { ...o, ox: k * W }); const pts = []; for (let i = 0; i <= 60; i++) { const pp = 9 * i / 60; pts.push([f(pp), pp]); }
      const q = f(p); return g.axes('Q', 'p', [xm / 2, xm], k ? [] : [1, 3, 5, 7]) + g.cur(g.P(pts), c) + g.line(0, p, xm, p, 'reg') + g.dot(q, p) + g.lab(q, p, n1(q), 'K', 'start', 7, -8) + `<text class="ptit" x="${k * W + W / 2 + 12}" y="14" text-anchor="middle">${t}</text>`; };
    return svgWrap(pan(0, 4, Q1, 'spotřebitel 1', 'D') + pan(1, 10, Q2, 'spotřebitel 2', 'D') + pan(2, 12, x => Q1(x) + Q2(x), 'trh = součet', 'M') + `<text class="bigop" x="200" y="170" text-anchor="middle">+</text><text class="bigop" x="400" y="170" text-anchor="middle">=</text>`, 600, 320)
      + stat(`Při ceně ${n1(p)}: ${n1(Q1(p))} + ${n1(Q2(p))} = <b>${n1(Q1(p) + Q2(p))}</b>. Tržní poptávka je <b>vodorovný součet</b>: při každé ceně se sečtou množství.`);
  } };

FIGDEF.elast = { ctl: [['p', 'Cena', 1, 9, 0.25, 7]],
  steps: [['Elastická část', { p: 8 }, 'Nahoře je |ε| > 1: zlevnění o 1 % zvýší množství o víc než 1 %, takže tržby vzrostou.'], ['Jednotková', { p: 5 }, 'Uprostřed je |ε| = 1 a tržby jsou největší (25).'], ['Neelastická část', { p: 2 }, 'Dole je |ε| < 1: další zlevnění tržby sníží. Firma by tu raději zdražila.']],
  draw(v) {
    const g = plane(10.5, 10.5, { h: 330 }), q = 10 - v.p, e = v.p / q, rev = v.p * q, h = plane(10.5, 27, { h: 220, m: { l: 58, r: 28, t: 16, b: 44 } });
    const top = svgWrap(g.axes('Q', 'p', [5, 10], [5, 10]) + g.poly([[0, 10], [0, 5], [5, 5]], 'a-el') + g.poly([[5, 5], [10, 0], [5, 0]], 'a-in')
      + `<path class="a-rev" d="${g.P([[0, 0], [0, v.p], [q, v.p], [q, 0]])} Z"/>` + g.cur(g.P([[0, 10], [10, 0]]), 'D') + g.lab(1.3, 7.4, '|ε| > 1 elastická', 'D') + g.lab(5, 5, '|ε| = 1', 'K', 'start', 12, -6) + g.lab(6.6, 1.4, '|ε| < 1 neelastická', 'S')
      + g.guide(q, v.p) + g.dot(q, v.p) + g.lab(q / 2, v.p / 2, 'tržby ' + n1(rev), 'G', 'middle', 0, 5), FW, 330);
    const bot = svgWrap(h.axes('Q', 'tržby TR', [5, 10], [25]) + h.cur(h.fn(x => x * (10 - x), 0, 10), 'G') + h.lab(8.8, 8.8 * 1.2, 'TR = p·Q', 'G', 'start', 6, 0) + h.line(q, 0, q, rev) + h.dot(q, rev), FW, 220);
    return top + bot + stat(`Poptávka Q = 10 − p. Při p = ${num(v.p, 2)}: |ε| = p/Q = <b>${n2(e)}</b> → ${e > 1.02 ? '<b>elastická</b>: zlevnění tržby zvýší' : e < 0.98 ? '<b>neelastická</b>: zlevnění tržby sníží' : '<b>jednotková</b>: tržby jsou maximální'}. Tržby p·Q = <b>${n1(rev)}</b>.`);
  } };

FIGDEF.etypes = { opt: [['m', 'Typ poptávky', [[0, 'dokonale neelastická'], [0.5, 'neelastická'], [1, 'jednotková'], [2, 'elastická'], [9, 'dokonale elastická']], 1]], ctl: [['p', 'Nová cena (původně 2)', 1, 3.5, 0.05, 3]],
  draw(v) {
    const m = +v.m, g = plane(9, 4.2), k = 4 * 2 ** m, Q = p => m === 9 ? NaN : k / p ** m, p = m === 9 ? 2 : v.p, q0 = 4, q1 = m === 9 ? 4 : Q(p), r0 = 8, r1 = p * q1;
    let s = g.axes('Q', 'p', [4], [2]);
    s += m === 9 ? g.cur(g.P([[0, 2], [9, 2]]), 'D') : m === 0 ? g.cur(g.P([[4, 0], [4, 4.2]]), 'D') : g.cur(g.P(Array.from({ length: 80 }, (_, i) => { const pp = 0.4 + 3.8 * i / 79; return [Math.min(9.5, Q(pp)), pp]; })), 'D');
    s += `<path class="a-rev old" d="${g.P([[0, 0], [0, 2], [4, 2], [4, 0]])} Z"/>` + (m === 9 ? '' : `<path class="a-rev" d="${g.P([[0, 0], [0, p], [Math.min(9, q1), p], [Math.min(9, q1), 0]])} Z"/>` + g.dot(Math.min(9, q1), p)) + g.dot(4, 2, 'dt o');
    const ch = r1 - r0, txt = { 0: 'Množství se vůbec nezmění (inzulin, sůl). Zdražení zvýší tržby o celou změnu ceny.', 0.5: 'Množství reaguje méně než cena. Při zdražení tržby <b>rostou</b>.', 1: 'Procentní změna množství se rovná procentní změně ceny: Q = k/p. Tržby se <b>nemění</b>.', 2: 'Množství reaguje víc než cena. Při zdražení tržby <b>klesají</b>.', 9: 'Za cenu 2 se prodá libovolné množství, za vyšší nic. Tak vidí poptávku firma v dokonalé konkurenci.' }[m];
    return svgWrap(s) + leg([['a-rev', 'tržby po změně ceny'], ['a-rev-old', 'tržby předtím (2 · 4 = 8)']]) + stat(`${txt}${m !== 9 ? ` Cena ${n2(p)} → množství ${n2(q1)}, tržby ${n2(r1)} (${ch >= 0 ? '+' : ''}${n2(ch)}).` : ''}`);
  } };

/* ===== 4. přednáška ===== */
FIGDEF.surplus = { ctl: [['q', 'Prodané množství', 5, 70, 1, 40]],
  steps: [['Rovnováha', { q: 40 }, 'Při q* = 40 je součet přebytků (modrá + zelená) největší možný. Tržní rovnováha je efektivní: MU = p = MC.'], ['Málo', { q: 25 }, 'Prodá se jen 25 (například kvůli kvótě): obchody mezi 25 a 40, na kterých by obě strany vydělaly, se neuskuteční. Červený trojúhelník je ztráta mrtvé váhy.'], ['Moc', { q: 55 }, 'Vyrábí se 55: posledních 15 kusů stojí víc (MC), než kolik mají pro kupující hodnotu (MU). Také ztráta.']],
  draw(v) {
    const g = plane(100, 110), q = v.q, qe = 40, pe = 60, Dp = x => 100 - x, Sp = x => 20 + x;
    let s = g.axes('Q', 'p, MU, MC', [q, qe].filter((x, i) => i === 0 || Math.abs(q - qe) > 3), [20, 60, 100]);
    const qq = Math.min(q, qe);
    s += g.poly([[0, 100], [0, pe], [qq, pe], [qq, Dp(qq)]], 'a-cs') + g.poly([[0, 20], [0, pe], [qq, pe], [qq, Sp(qq)]], 'a-ps');
    if (q < qe) s += g.poly([[q, Dp(q)], [qe, pe], [q, Sp(q)]], 'a-dwl'); else if (q > qe) s += g.poly([[qe, pe], [q, Sp(q)], [q, Dp(q)]], 'a-dwl');
    s += g.cur(g.P([[0, 100], [100, 0]]), 'D') + g.cur(g.P([[0, 20], [85, 105]]), 'S') + g.lab(90, 10, 'D = MU', 'D', 'end', 0, -10) + g.lab(80, 100, 'S = MC', 'S', 'end', -8, 0)
      + g.dot(qe, pe, 'dt o') + g.line(q, 0, q, 108, 'reg') + g.lab(20, 72, 'přebytek spotřebitele', 'D', 'middle') + g.lab(20, 46, 'přebytek výrobce', 'G', 'middle');
    const cs = q <= qe ? 0.5 * qq * (100 - pe) + 0 : 0, tot = q <= qe ? 0.5 * q * (80 + (Dp(q) - Sp(q))) : 1600 - 0.5 * (q - qe) * (Sp(q) - Dp(q)), dwl = 1600 - tot;
    return svgWrap(s) + leg([['a-cs', 'přebytek spotřebitele'], ['a-ps', 'přebytek výrobce'], ['a-dwl', 'ztráta mrtvé váhy']])
      + stat(`Celkový přebytek = <b>${n0(tot)}</b> z maximálních 1 600${dwl > 0.5 ? `, ztráta mrtvé váhy <b>${n0(dwl)}</b>` : ' (maximum)'}. ${q === qe ? 'Každý kupující, jehož ochota platit převyšuje náklady výroby, nakoupil.' : ''}`);
  } };

FIGDEF.tax = { opt: [['who', 'Komu je daň uložena', [['s', 'prodávajícím'], ['d', 'kupujícím']], 's']], ctl: [['t', 'Daň na jednotku t', 0, 60, 1, 20], ['a', 'Sklon poptávky (vyšší = méně elastická)', 0.3, 4, 0.1, 1], ['k', 'Sklon nabídky (vyšší = méně elastická)', 0.3, 4, 0.1, 1]],
  steps: [['Bez daně', { t: 0, a: 1, k: 1 }, 'Rovnováha při p* = 60 a q* = 40.'], ['Daň 20', { t: 20 }, 'Daň vrazí mezi cenu kupujícího a prodávajícího klín 20. Kupující platí 70, prodávající dostane 50, prodá se jen 30.'], ['Nepružná poptávka', { a: 3.5, k: 1 }, 'Kupující nemají kam uhnout (léky): skoro celou daň zaplatí oni, cena pro ně stoupne skoro o 20.'], ['Nepružná nabídka', { a: 1, k: 3.5 }, 'Teď nemohou uhnout prodávající (rybí trh): většinu daně nesou oni.'], ['Uložena kupujícím', { who: 'd', a: 1, k: 1 }, 'Když daň platí kupující, posune se dolů poptávka místo nahoru nabídky. Výsledné ceny a množství jsou <b>stejné</b>.']],
  draw(v) {
    const a = v.a, k = v.k, t = v.t, qe = 80 / (a + k), pe = 100 - a * qe, qt = Math.max(0, (80 - t) / (a + k)), pD = 100 - a * qt, pS = 20 + k * qt;
    const X = Math.min(120, Math.max(60, 1.5 * qe)), g = plane(X, 110), Dp = q => 100 - a * q, Sp = q => 20 + k * q;
    const cs = 0.5 * qt * (100 - pD), ps = 0.5 * qt * (pS - 20), rev = t * qt, dwl = 0.5 * (qe - qt) * (pD - pS);
    let s = g.axes('Q', 'p', [+qt.toFixed(1), +qe.toFixed(1)].filter((x, i) => i || t > 0), t ? [+pS.toFixed(1), +pD.toFixed(1)] : [+pe.toFixed(1)]);
    s += g.clip(g.poly([[0, 100], [0, pD], [qt, pD]], 'a-cs') + g.poly([[0, 20], [0, pS], [qt, pS]], 'a-ps') + g.poly([[0, pS], [0, pD], [qt, pD], [qt, pS]], 'a-tax') + g.poly([[qt, pD], [qe, pe], [qt, pS]], 'a-dwl')
      + g.cur(g.fn(Dp, 0, X), 'D') + g.cur(g.fn(Sp, 0, X), 'S')
      + (t ? (v.who === 's' ? g.cur(g.fn(q => Sp(q) + t, 0, X), 'S', true) : g.cur(g.fn(q => Dp(q) - t, 0, X), 'D', true)) : ''));
    const xs = Math.min(X * .9, 85 / k), xd = Math.min(X * .92, 92 / a);
    s += g.lab(xd, Dp(xd), 'D', 'D', 'start', 8, -6) + g.lab(xs, Sp(xs), 'S', 'S', 'end', -8, 0) + g.dot(qe, pe, 'dt o') + g.lab(qe, pe, 'E₀', 'K', 'start', 8, 4)
      + (t ? g.lab(xs * .82, Sp(xs * .82) + (v.who === 's' ? t : 0), v.who === 's' ? 'S + t' : '', 'S', 'end', -8, -4) + g.lab(xd * .9, Dp(xd * .9) - (v.who === 'd' ? t : 0), v.who === 'd' ? 'D − t' : '', 'D', 'start', 6, 16)
        + g.guide(qt, pD) + g.line(0, pS, qt, pS) + g.arrow(qt + X * .02, pS, qt + X * .02, pD, 'arr cK') + g.lab(qt + X * .03, (pS + pD) / 2, 't', 'K', 'start', 6, 5) : '');
    const shB = t ? (pD - pe) / t : k / (a + k);
    return svgWrap(s) + leg([['a-cs', 'přebytek spotřebitele'], ['a-ps', 'přebytek výrobce'], ['a-tax', 'výnos daně'], ['a-dwl', 'ztráta mrtvé váhy']])
      + stat(t ? `Kupující platí <b>${n1(pD)}</b>, prodávající dostane <b>${n1(pS)}</b>, prodá se <b>${n1(qt)}</b> místo ${n1(qe)}. Kupující nesou <b>${pct(100 * shB, 0)}</b> daně, prodávající ${pct(100 - 100 * shB, 0)}. Výnos daně ${n0(rev)}, ztráta mrtvé váhy <b>${n0(dwl)}</b>.` : `Bez daně: p* = ${n1(pe)}, q* = ${n1(qe)}. Přebytek spotřebitele ${n0(cs)}, výrobce ${n0(ps)}.`);
  } };

FIGDEF.ceil = { ctl: [['p', 'Regulovaná cena', 25, 95, 1, 45]],
  steps: [['Strop, který váže', { p: 45 }, 'Cenový strop 45 pod rovnovážnou cenou 60: kupující chtějí 55, výrobci nabídnou jen 25. Nedostatek 30 (fronty, černý trh).'], ['Strop, který neváže', { p: 75 }, 'Kdyby šlo o strop 75 nad rovnováhou, trh by dál fungoval při 60. Tady to ale čti jako minimální cenu 75: výrobci nabízejí 55, kupující chtějí 25 → přebytek 30.'], ['Rovnovážná cena', { p: 60 }, 'Regulace na úrovni rovnovážné ceny nic nemění.']],
  draw(v) {
    const g = plane(100, 110), qD = 100 - v.p, qS = v.p - 20, pe = 60, qe = 40, q = Math.min(qD, qS), binds = Math.abs(v.p - pe) > .5, pd = 100 - q, ps = 20 + q;
    let s = g.axes('Q', 'p', [+qS.toFixed(0), +qD.toFixed(0)], [pe]) + (binds ? g.poly([[q, pd], [qe, pe], [q, ps]], 'a-dwl') : '');
    s += g.cur(g.P([[0, 100], [100, 0]]), 'D') + g.cur(g.P([[0, 20], [85, 105]]), 'S') + g.lab(94, 6, 'D', 'D', 'end', 0, -8) + g.lab(80, 100, 'S', 'S', 'end', -8, 0)
      + g.line(0, v.p, 100, v.p, 'reg') + g.lab(100, v.p, v.p < pe ? 'cenový strop' : v.p > pe ? 'minimální cena' : 'regulace = p*', 'K', 'end', 0, -8) + g.dot(qe, pe, 'dt o');
    if (binds) s += g.dot(qD, v.p) + g.dot(qS, v.p) + `<path class="${v.p < pe ? 'a-short' : 'a-surp'}" d="${g.P([[Math.min(qD, qS), v.p - 1.2], [Math.max(qD, qS), v.p - 1.2], [Math.max(qD, qS), v.p + 1.2], [Math.min(qD, qS), v.p + 1.2]])} Z"/>`
      + g.lab((qD + qS) / 2, v.p, v.p < pe ? 'nedostatek ' + n0(qD - qS) : 'přebytek ' + n0(qS - qD), v.p < pe ? 'R' : 'G', 'middle', 0, v.p < pe ? 22 : -12);
    return svgWrap(s) + leg([['a-dwl', 'ztráta mrtvé váhy']]) + stat(v.p < pe ? `Strop ${v.p} &lt; p* = 60 <b>trh váže</b>: poptává se ${n0(qD)}, nabízí ${n0(qS)}, <b>nedostatek ${n0(qD - qS)}</b>. Prodá se jen ${n0(q)}.` : v.p > pe ? `Minimální cena ${v.p} &gt; p* = 60 <b>trh váže</b>: nabízí se ${n0(qS)}, poptává ${n0(qD)}, <b>přebytek ${n0(qS - qD)}</b>.` : 'Regulace na rovnovážné ceně nic nemění.');
  } };

FIGDEF.minwage = { ctl: [['w', 'Minimální mzda', 80, 200, 2, 160]],
  draw(v) {
    const g = plane(100, 220), wD = L => 200 - 1.6 * L, wS = L => 40 + 1.6 * L, we = 120, Le = 50, Ld = (200 - v.w) / 1.6, Ls = (v.w - 40) / 1.6, binds = v.w > we + .5;
    let s = g.axes('práce L', 'mzda w', binds ? [+Ld.toFixed(0), +Ls.toFixed(0)] : [Le], [we]) + g.cur(g.P([[0, 200], [100, 40]]), 'D') + g.cur(g.P([[0, 40], [100, 200]]), 'S')
      + g.lab(96, wD(96), 'poptávka po práci (firmy)', 'D', 'end', 0, -12) + g.lab(96, wS(96), 'nabídka práce (lidé)', 'S', 'end', 0, 20) + g.dot(Le, we, 'dt o');
    if (binds) s += g.line(0, v.w, 100, v.w, 'reg') + g.dot(Ld, v.w) + g.dot(Ls, v.w) + `<path class="a-surp" d="${g.P([[Ld, v.w - 2.5], [Ls, v.w - 2.5], [Ls, v.w + 2.5], [Ld, v.w + 2.5]])} Z"/>` + g.lab((Ld + Ls) / 2, v.w, 'nezaměstnaní ' + n0(Ls - Ld), 'R', 'middle', 0, -12);
    return svgWrap(s) + stat(binds ? `Při minimální mzdě ${v.w} chce pracovat ${n0(Ls)} lidí, firmy ale zaměstnají jen ${n0(Ld)}: <b>nezaměstnanost ${n0(Ls - Ld)}</b>. Kdo práci má, vydělá víc.` : `Minimální mzda ${v.w} je pod rovnovážnou mzdou 120: trh neváže, zaměstnáno je 50.`);
  } };

FIGDEF.laffer = { ctl: [['t', 'Daňová sazba (%)', 0, 100, 1, 25]],
  draw(v) {
    const g = plane(100, 110), R = t => 4 * t * (100 - t) / 100, t = v.t, r = R(t), tw = 100 - t;
    let s = g.axes('daňová sazba %', 'daňový příjem', [0, 50, 100], [100]) + g.cur(g.fn(R, 0, 100, 100), 'M') + g.dot(50, 100, 'dt o') + g.lab(50, 100, 'L (maximum)', 'K', 'middle', 0, -12)
      + g.guide(t, r) + g.dot(t, r) + (Math.abs(t - 50) > 2 ? g.dot(tw, r, 'dt x') + g.line(t, r, tw, r, 'gd') : '');

FIGDEF.rent = { ctl: [['b', 'Strmost křivek (vyšší = méně pružné)', 0.4, 3, 0.1, 2]],

FIGDEF.ic = { opt: [['typ', 'Preference', [['cd', 'běžné (konvexní)'], ['s', 'dokonalé substituty'], ['c', 'dokonalé komplementy']], 'cd']], ctl: [['x', 'Bod na křivce (x₁)', 2, 18, 0.2, 5]],
